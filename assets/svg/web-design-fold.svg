<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FF0C8"/><stop offset="1" stop-color="#00B892"/></linearGradient>
  <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6B4FF"/><stop offset="1" stop-color="#8A68FF"/></linearGradient>
  <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC94D"/><stop offset="1" stop-color="#FF7A57"/></linearGradient>
  <linearGradient id="gHero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03866F"/><stop offset=".55" stop-color="#004337"/><stop offset="1" stop-color="#00211B"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131B18"/><stop offset="1" stop-color="#0C1110"/></linearGradient>
  <radialGradient id="gGlow" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#00D4A3" stop-opacity=".26"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <clipPath id="win"><rect x="96" y="100" width="448" height="380" rx="24"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .grow,.card,.pop,.ripple,.word{transform-box:fill-box}
  .loop{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
  /* column guides */
  .guide{animation-name:guide}
  @keyframes guide{0%,2%{opacity:0}10%,40%{opacity:1}50%,100%{opacity:0}}
  /* blocks build left->right */
  .grow{transform-origin:0 50%;animation-name:grow}
  @keyframes grow{0%,8%{transform:scaleX(0);opacity:0}16%{transform:scaleX(1);opacity:1}90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}
  .b1{animation-delay:.1s}.b2{animation-delay:.3s}.b3{animation-delay:.5s}.b4{animation-delay:.7s}.b5{animation-delay:.9s}.b6{animation-delay:1.1s}.b7{animation-delay:1.3s}.b8{animation-delay:1.5s}
  .pop{transform-origin:50% 50%;animation-name:pop}
  @keyframes pop{0%,14%{transform:scale(0);opacity:0}20%{transform:scale(1.08);opacity:1}23%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(.8);opacity:0}}
  .p2{animation-delay:.2s}.p3{animation-delay:.4s}
  /* cursor goes to the button and clicks */
  .cur{animation-name:cur}
  @keyframes cur{0%,30%{transform:translate(470px,470px);opacity:0}34%{opacity:1}46%{transform:translate(232px,356px)}49%{transform:translate(232px,356px) scale(.86)}52%,72%{transform:translate(232px,356px) scale(1);opacity:1}80%,100%{transform:translate(300px,430px);opacity:0}}
  .ripple{transform-origin:50% 50%;animation-name:ripple}
  @keyframes ripple{0%,48%{transform:scale(.4);opacity:0}50%{opacity:.7}62%,100%{transform:scale(2.4);opacity:0}}
  .ctaOn{animation-name:ctaOn}
  @keyframes ctaOn{0%,49%{opacity:0}52%,90%{opacity:1}97%,100%{opacity:0}}
  .ctaOff{animation-name:ctaOff}
  @keyframes ctaOff{0%,14%{opacity:0}20%,49%{opacity:1}52%,100%{opacity:0}}
  .card{animation-name:card}
  @keyframes card{0%,8%{opacity:0;transform:translateY(18px) scale(.94)}18%,90%{opacity:1;transform:none}98%,100%{opacity:0;transform:translateY(-8px)}}
  .c2{animation-delay:.3s}.c3{animation-delay:.6s}.c4{animation-delay:.9s}
  .bob{animation:bob 4s ease-in-out infinite}
  .bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  .walker{animation:walk 3s ease-in-out infinite;offset-path:path("M28 0 H 92 H 156");offset-rotate:0deg}
  @keyframes walk{0%{offset-distance:0%}45%,55%{offset-distance:50%}100%{offset-distance:100%}}
  .scroll{animation:scroll 4s ease-in-out infinite}
  @keyframes scroll{0%,15%{transform:translateY(0)}50%,65%{transform:translateY(-38px)}100%{transform:translateY(0)}}
  .shape1{transform-box:fill-box;transform-origin:50% 50%;animation:float1 5s ease-in-out infinite}
  .shape2{transform-box:fill-box;transform-origin:50% 50%;animation:float1 5s ease-in-out -2.5s infinite}
  @keyframes float1{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(8deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<circle cx="320" cy="300" r="300" fill="url(#gGlow)"/>

<!-- browser window -->
<g filter="url(#soft)"><rect x="96" y="100" width="448" height="380" rx="24" fill="url(#gBoard)" stroke="#22302C"/></g>
<g clip-path="url(#win)">
  <rect x="96" y="100" width="448" height="40" fill="#0A0F0E"/>
  <circle cx="122" cy="120" r="5" fill="#FF8A6B"/><circle cx="140" cy="120" r="5" fill="#FFC94D"/><circle cx="158" cy="120" r="5" fill="#00D4A3"/>
  <rect x="226" y="110" width="188" height="20" rx="10" fill="#151D1A"/>
  <circle cx="240" cy="120" r="3.5" fill="#00D4A3"/>
  <text x="250" y="124" font-size="10.5" font-weight="500" fill="#8FA39E">yourbrand.com</text>

  <!-- 12-column guides -->
  <g class="loop guide" fill="#5FF0C8" fill-opacity=".05">
    <rect x="120" y="140" width="28" height="340"/><rect x="158" y="140" width="28" height="340"/><rect x="196" y="140" width="28" height="340"/><rect x="234" y="140" width="28" height="340"/>
    <rect x="272" y="140" width="28" height="340"/><rect x="310" y="140" width="28" height="340"/><rect x="348" y="140" width="28" height="340"/><rect x="386" y="140" width="28" height="340"/>
    <rect x="424" y="140" width="28" height="340"/><rect x="462" y="140" width="28" height="340"/><rect x="500" y="140" width="24" height="340"/>
  </g>

  <!-- site nav -->
  <rect class="loop grow b1" x="120" y="156" width="400" height="30" rx="10" fill="#151D1A"/>
  <g class="loop pop"><circle cx="138" cy="171" r="7" fill="url(#gMint)"/></g>
  <g class="loop grow b2" fill="#3A4A46"><rect x="380" y="167" width="28" height="7" rx="3.5"/><rect x="416" y="167" width="28" height="7" rx="3.5"/><rect x="452" y="167" width="28" height="7" rx="3.5"/></g>
  <rect class="loop grow b2" x="490" y="164" width="22" height="13" rx="6.5" fill="#00D4A3"/>

  <!-- hero -->
  <rect class="loop grow b3" x="120" y="198" width="400" height="190" rx="16" fill="url(#gHero)"/>
  <rect class="loop grow b4" x="142" y="226" width="64" height="8" rx="4" fill="#5FF0C8"/>
  <rect class="loop grow b4" x="142" y="246" width="170" height="16" rx="8" fill="#F2F5F4"/>
  <rect class="loop grow b5" x="142" y="270" width="130" height="16" rx="8" fill="#F2F5F4"/>
  <rect class="loop grow b5" x="142" y="298" width="150" height="7" rx="3.5" fill="#C9F5E8" fill-opacity=".55"/>
  <rect class="loop grow b6" x="142" y="312" width="118" height="7" rx="3.5" fill="#C9F5E8" fill-opacity=".55"/>
  <!-- CTA (before / after click) -->
  <g class="loop ctaOff"><rect x="142" y="336" width="104" height="30" rx="15" fill="#0A0A0A"/><text x="194" y="355" text-anchor="middle" font-size="11" font-weight="600" fill="#5FF0C8">Get started</text></g>
  <g class="loop ctaOn"><rect x="142" y="336" width="104" height="30" rx="15" fill="#5FF0C8"/><text x="194" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#04342C">Let's go ✓</text></g>
  <circle class="loop ripple" cx="194" cy="351" r="22" fill="none" stroke="#5FF0C8" stroke-width="2"/>
  <!-- hero art -->
  <g class="loop pop p2">
    <circle class="shape1" cx="430" cy="272" r="44" fill="url(#gViolet)"/>
    <rect class="shape2" x="378" y="294" width="58" height="58" rx="14" fill="url(#gCoral)"/>
    <circle cx="470" cy="330" r="16" fill="url(#gMint)"/>
  </g>

  <!-- 3 feature cards -->
  <g class="loop grow b7"><rect x="120" y="400" width="124" height="66" rx="12" fill="#151D1A"/><rect x="134" y="414" width="22" height="22" rx="7" fill="#00D4A3"/><rect x="134" y="444" width="80" height="7" rx="3.5" fill="#3A4A46"/></g>
  <g class="loop grow b8"><rect x="258" y="400" width="124" height="66" rx="12" fill="#151D1A"/><rect x="272" y="414" width="22" height="22" rx="7" fill="#9B7BFF"/><rect x="272" y="444" width="80" height="7" rx="3.5" fill="#3A4A46"/></g>
  <g class="loop grow b8" style="animation-delay:1.7s"><rect x="396" y="400" width="124" height="66" rx="12" fill="#151D1A"/><rect x="410" y="414" width="22" height="22" rx="7" fill="#FF8A6B"/><rect x="410" y="444" width="80" height="7" rx="3.5" fill="#3A4A46"/></g>
</g>

<!-- cursor -->
<g class="loop cur">
  <path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 15 L18 15 Z" fill="#F2F5F4" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round"/>
</g>

<!-- card: responsive phone -->
<g class="loop card"><g class="bob">
  <g filter="url(#soft)"><rect x="500" y="250" width="116" height="214" rx="22" fill="#111614" stroke="#22302C"/></g>
  <rect x="510" y="262" width="96" height="190" rx="14" fill="#0A0F0E"/>
  <rect x="542" y="268" width="32" height="6" rx="3" fill="#22302C"/>
  <svg x="510" y="280" width="96" height="168" viewBox="0 0 96 168" overflow="hidden">
    <g class="scroll">
      <rect x="8" y="4" width="80" height="12" rx="6" fill="#151D1A"/><circle cx="16" cy="10" r="3.5" fill="#00D4A3"/>
      <rect x="8" y="22" width="80" height="80" rx="10" fill="url(#gHero)"/>
      <rect x="16" y="34" width="46" height="7" rx="3.5" fill="#F2F5F4"/><rect x="16" y="46" width="34" height="7" rx="3.5" fill="#F2F5F4"/>
      <rect x="16" y="82" width="40" height="12" rx="6" fill="#5FF0C8"/>
      <circle cx="70" cy="70" r="12" fill="url(#gViolet)"/>
      <rect x="8" y="110" width="80" height="34" rx="8" fill="#151D1A"/><rect x="16" y="118" width="12" height="12" rx="4" fill="#00D4A3"/>
      <rect x="8" y="150" width="80" height="34" rx="8" fill="#151D1A"/><rect x="16" y="158" width="12" height="12" rx="4" fill="#9B7BFF"/>
      <rect x="8" y="190" width="80" height="34" rx="8" fill="#151D1A"/><rect x="16" y="198" width="12" height="12" rx="4" fill="#FF8A6B"/>
    </g>
  </svg>
</g></g>
<g class="loop card"><text x="558" y="486" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">RESPONSIVE</text></g>

<!-- card: user journey -->
<g class="loop card c2"><g class="bob2">
  <g filter="url(#soft)"><rect x="24" y="500" width="232" height="96" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="42" y="526" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">USER JOURNEY</text>
  <g transform="translate(42 558)">
    <path class="flow" d="M28 0 H 156" stroke="#5FF0C8" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="14" cy="0" r="14" fill="#151D1A" stroke="#00D4A3" stroke-width="2"/><circle cx="92" cy="0" r="14" fill="#151D1A" stroke="#9B7BFF" stroke-width="2"/><circle cx="170" cy="0" r="14" fill="#151D1A" stroke="#FF8A6B" stroke-width="2"/>
    <path d="M8 1 L14 -5 L20 1 V7 H8Z" fill="#00D4A3"/>
    <rect x="86" y="-6" width="12" height="12" rx="3" fill="#9B7BFF"/>
    <path d="M164 0 l4 4 8 -8" fill="none" stroke="#FF8A6B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="walker" r="4.5" fill="#F2F5F4"/>
    <text x="14" y="30" text-anchor="middle" font-size="9.5" fill="#8FA39E">Visit</text>
    <text x="92" y="30" text-anchor="middle" font-size="9.5" fill="#8FA39E">Explore</text>
    <text x="170" y="30" text-anchor="middle" font-size="9.5" fill="#8FA39E">Convert</text>
  </g>
</g></g>

<!-- card: UI kit -->
<g class="loop card c3"><g class="bob">
  <g filter="url(#soft)"><rect x="440" y="24" width="176" height="112" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="458" y="50" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">UI KIT</text>
  <rect x="458" y="62" width="64" height="24" rx="12" fill="#00D4A3"/><text x="490" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#04342C">Button</text>
  <rect x="530" y="62" width="64" height="24" rx="12" fill="none" stroke="#3A4A46"/><text x="562" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#C9D6D2">Ghost</text>
  <rect x="458" y="98" width="40" height="22" rx="11" fill="#00D4A3"/><circle cx="487" cy="109" r="8" fill="#F2F5F4"/>
  <circle cx="518" cy="109" r="9" fill="url(#gViolet)"/><circle cx="542" cy="109" r="9" fill="url(#gCoral)"/><circle cx="566" cy="109" r="9" fill="#F2F5F4"/>
</g></g>

<!-- badge -->
<g class="loop card c4"><g class="bob2">
  <g filter="url(#soft)"><rect x="24" y="48" width="150" height="40" rx="20" fill="#111614" stroke="#22302C"/></g>
  <circle cx="46" cy="68" r="6" fill="#00D4A3"/>
  <text x="60" y="72.5" font-size="12" font-weight="600" fill="#F2F5F4">UI · UX · Mobile</text>
</g></g>
</svg>
