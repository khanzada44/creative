<style>
text{font-family:Poppins,"Segoe UI","Helvetica Neue",Arial,sans-serif}
.lbl{font-size:7.5px;font-weight:700;letter-spacing:1.6px;fill:#2ee6c3}
.f1{animation:fl 6s ease-in-out infinite}.f2{animation:fl 7s ease-in-out -2s infinite}.f3{animation:fl 6.5s ease-in-out -4s infinite}.f4{animation:fl 7.5s ease-in-out -1s infinite}
.ph{animation:fl2 8s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes fl2{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.dot{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3s ease-in-out infinite}
.g2{animation-delay:.2s}.g3{animation-delay:.4s}.g4{animation-delay:.6s}.g5{animation-delay:.8s}
@keyframes grow{0%{transform:scaleY(.25)}35%,80%{transform:scaleY(1)}100%{transform:scaleY(.25)}}

.cur{animation:cur 4s ease-in-out infinite}
@keyframes cur{0%{transform:translate(70px,60px)}40%{transform:translate(0,0)}48%{transform:translate(0,0) scale(.9)}55%,75%{transform:translate(0,0)}100%{transform:translate(70px,60px)}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 4s ease-out infinite;opacity:0}
@keyframes rip{0%,44%{transform:scale(.2);opacity:0}48%{opacity:.9}70%,100%{transform:scale(2.2);opacity:0}}
.cta{animation:cta 4s ease-in-out infinite}
@keyframes cta{0%,44%,60%,100%{fill:#2ee6c3}48%,55%{fill:#7ff7df}}
.ring{stroke-dasharray:126;animation:ring 4s ease-in-out infinite}
@keyframes ring{0%{stroke-dashoffset:126}50%,85%{stroke-dashoffset:38}100%{stroke-dashoffset:126}}
.coin{animation:coin 2s ease-in-out infinite}
@keyframes coin{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.count{animation:count 4s ease-in-out infinite}
@keyframes count{0%,45%{opacity:0}55%,90%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
