<text x="236" y="90" text-anchor="middle" font-size="7.5" font-weight="600" fill="#7f918d">campaign-dashboard</text></g><g class="f2"><g filter="url(#sh)"><rect x="26" y="146" width="96" height="28" rx="14" fill="url(#cardBg)" stroke="#2ee6c3" stroke-opacity=".14"/></g><circle class="dot" cx="41" cy="160" r="5" fill="#1fd1b0" opacity=".3"/><circle cx="41" cy="160" r="3.5" fill="#1fd1b0"/><text x="52" y="163" font-size="8" font-weight="600" fill="#e7efed">Campaign live</text></g><g class="f3"><g filter="url(#sh)"><rect x="26" y="216" width="100" height="98" rx="12" fill="url(#cardBg)" stroke="#2ee6c3" stroke-opacity=".14"/></g><text x="38" y="236" class="lbl">CLICKS</text><rect class="grow g1" x="40" y="282" width="10" height="18" rx="3" fill="#2ee6c3"/><rect class="grow g2" x="56" y="274" width="10" height="26" rx="3" fill="#2ee6c3"/><rect class="grow g3" x="72" y="278" width="10" height="22" rx="3" fill="#9b7bff"/><rect class="grow g4" x="88" y="266" width="10" height="34" rx="3" fill="#2ee6c3"/><rect class="grow g5" x="104" y="258" width="10" height="42" rx="3" fill="#ff9b5c"/><text x="38" y="308" font-size="6.5" font-weight="600" fill="#d9e3e1">Daily ad clicks</text></g><g class="f1"><g filter="url(#sh)"><rect x="313" y="30" width="123" height="72" rx="12" fill="url(#cardBg)" stroke="#2ee6c3" stroke-opacity=".14"/></g><text x="325" y="50" class="lbl">BUDGET</text><circle cx="412" cy="72" r="20" fill="none" stroke="#22302c" stroke-width="6"/><circle class="ring" cx="412" cy="72" r="20" fill="none" stroke="#2ee6c3" stroke-width="6" stroke-linecap="round" transform="rotate(-90 412 72)"/><text x="412" y="75" text-anchor="middle" font-size="8" font-weight="800" fill="#e6f5f1">70%</text><text x="325" y="72" font-size="11" font-weight="800" fill="#e6f5f1">$2,100</text><text x="325" y="84" font-size="6" fill="#7f918d">spent wisely</text></g><g class="f4"><g filter="url(#sh)"><rect x="330" y="341" width="118" height="86" rx="12" fill="url(#cardBg)" stroke="#2ee6c3" stroke-opacity=".14"/></g><text x="342" y="361" class="lbl">CONVERSIONS</text><g class="coin"><circle cx="356" cy="392" r="12" fill="url(#gold)"/><text x="356" y="396.5" text-anchor="middle" font-size="12" font-weight="900" fill="#9a6406">$</text></g><text x="376" y="396" font-size="18" font-weight="800" fill="#e6f5f1">312</text><text class="count" x="420" y="384" font-size="8" font-weight="800" fill="#2ee6c3">+1</text><text x="342" y="416" font-size="6" fill="#7f918d">sales &amp; leads</text></g></svg>