<rect x="140" y="232" width="92" height="56" rx="12" fill="url(#purple)"/><text x="186" y="260" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4.8%</text><text x="186" y="276" text-anchor="middle" font-size="6.5" font-weight="700" fill="#fff" opacity=".85">CTR</text>
<rect x="240" y="232" width="92" height="56" rx="12" fill="url(#orange)"/><text x="286" y="260" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">$1.20</text><text x="286" y="276" text-anchor="middle" font-size="6.5" font-weight="700" fill="#fff" opacity=".85">COST / CLICK</text>
<rect x="140" y="298" width="192" height="52" rx="12" fill="#12201d"/>
<path d="M152 338l26-10 24 4 26-14 26 4 26-14 26-6" stroke="#2ee6c3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="152" y="312" font-size="6.5" font-weight="700" fill="#cfe0dc">Leads this month</text>
