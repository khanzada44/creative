<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 557 435" width="557" height="435" role="img" aria-labelledby="t">
<title id="t">Pay-per-click advertising by Creative Converge</title>
<defs>
<radialGradient id="glow" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#125a48" stop-opacity=".55"/><stop offset=".55" stop-color="#0a2822" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121c1a"/><stop offset="1" stop-color="#0b1211"/></linearGradient>
<linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a18cf6"/><stop offset="1" stop-color="#6a4fc4"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb48a"/><stop offset="1" stop-color="#e9763f"/></linearGradient>
<linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ff7df"/><stop offset="1" stop-color="#17b998"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#c98a12"/></linearGradient>
<pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#2ee6c3" stroke-opacity=".06"/></pattern>
<filter id="sh" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
