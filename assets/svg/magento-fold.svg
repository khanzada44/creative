<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B892"/><stop offset="1" stop-color="#5FF0C8"/></linearGradient>
  <linearGradient id="gMintV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#00B892"/><stop offset="1" stop-color="#5FF0C8"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131B18"/><stop offset="1" stop-color="#0C1110"/></linearGradient>
  <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00D4A3" stop-opacity=".35"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></linearGradient>
  <radialGradient id="gGlow" cx=".45" cy=".45" r=".5"><stop offset="0" stop-color="#00D4A3" stop-opacity=".26"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <clipPath id="win"><rect x="44" y="70" width="400" height="312" rx="22"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .sb,.pb,.wb{transform-box:fill-box}
  .A{animation-duration:8s;animation-iteration-count:infinite;animation-fill-mode:backwards}
  .S{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
  /* catalog */
  .sw{animation-name:sw;animation-timing-function:ease-in-out}
  @keyframes sw{0%,6%{transform:translateY(0);opacity:0}9%{opacity:1}44%{transform:translateY(120px);opacity:1}48%,100%{transform:translateY(120px);opacity:0}}
  .sb{transform-origin:0 50%;animation-name:sb;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
  @keyframes sb{0%,10%{transform:scaleX(var(--a))}30%,92%{transform:scaleX(var(--b))}100%{transform:scaleX(var(--a))}}
  .s1{animation-delay:0s}.s2{animation-delay:.3s}.s3{animation-delay:.6s}.s4{animation-delay:.9s}.s5{animation-delay:1.2s}
  .y1{animation-name:y1}.y2{animation-name:y2}
  @keyframes y1{0%{opacity:1}52%{opacity:0}97%{opacity:1}}
  @keyframes y2{0%{opacity:0}52%{opacity:1}97%{opacity:0}}
  .imp{animation-name:imp;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}
  @keyframes imp{0%,54%{transform:translateY(-12px);opacity:0}60%,90%{transform:translateY(0);opacity:1}96%,100%{transform:translateY(-12px);opacity:0}}
  .wb{transform-origin:0 50%;animation-name:wb;animation-timing-function:ease-in-out}
  @keyframes wb{0%,20%{transform:scaleX(.45)}50%,90%{transform:scaleX(1)}100%{transform:scaleX(.45)}}
  .w2{animation-delay:.4s}.w3{animation-delay:.8s}
  /* traffic */
  .ln{stroke-dasharray:260;animation:ln 8s ease-in-out infinite}
  @keyframes ln{0%{stroke-dashoffset:260}45%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:260}}
  .ar{animation-name:ar}
  @keyframes ar{0%,20%{opacity:0}45%,90%{opacity:1}100%{opacity:0}}
  .live{animation:live 1.4s ease-in-out infinite}
  @keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
  /* performance */
  .pb{transform-origin:0 50%;animation-name:pb;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
  @keyframes pb{0%,30%{transform:scaleX(.3)}55%,92%{transform:scaleX(1)}100%{transform:scaleX(.3)}}
  .pb2{animation-delay:.3s}
  .t1{animation-name:t1}.t2{animation-name:t2}
  @keyframes t1{0%{opacity:1}50%{opacity:0}97%{opacity:1}}
  @keyframes t2{0%{opacity:0}50%{opacity:1}97%{opacity:0}}
  /* integrations */
  .pk{offset-rotate:0deg;animation:pk 2.4s linear infinite}
  @keyframes pk{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
  .q1{offset-path:path('M158 516 L72 456')}.q2{offset-path:path('M244 456 L158 516');animation-delay:-.6s}
  .q3{offset-path:path('M158 516 L244 576');animation-delay:-1.2s}.q4{offset-path:path('M72 576 L158 516');animation-delay:-1.8s}
  .hub{animation:hub 2.4s ease-in-out infinite}
  @keyframes hub{0%,100%{opacity:.25}50%{opacity:.6}}
  /* checkout */
  .c1,.c2,.c3{animation-name:cc}
  @keyframes cc{0%,10%{opacity:0}16%,92%{opacity:1}98%,100%{opacity:0}}
  .c2{animation-delay:1s}.c3{animation-delay:2s}
  .ok{animation-name:ok;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
  @keyframes ok{0%,46%{opacity:0;transform:translateY(8px)}52%,92%{opacity:1;transform:none}98%,100%{opacity:0;transform:translateY(8px)}}
  .bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.sw,.y1,.t1{opacity:0}.sb{transform:scaleX(var(--b))}.ln{stroke-dashoffset:0}.pk{opacity:0}}
</style>

<circle cx="300" cy="300" r="310" fill="url(#gGlow)"/>

<!-- ===== catalog admin ===== -->
<g filter="url(#soft)"><rect x="44" y="70" width="400" height="312" rx="22" fill="url(#gBoard)" stroke="#22302C"/></g>
<g clip-path="url(#win)">
  <rect x="44" y="70" width="400" height="38" fill="#0A0F0E"/>
  <circle cx="66" cy="89" r="5" fill="#FF8A6B"/><circle cx="84" cy="89" r="5" fill="#FFC94D"/><circle cx="102" cy="89" r="5" fill="#00D4A3"/>
  <text x="122" y="93" font-size="11" font-weight="600" fill="#C9D6D2">Catalog · Products</text>
  <rect x="338" y="79" width="92" height="20" rx="10" fill="#0F3D33"/>
