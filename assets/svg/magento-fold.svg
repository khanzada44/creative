  <text class="S y2" x="384" y="93" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5FF0C8">13,720 SKUs</text>
  <!-- toolbar -->
  <rect x="60" y="118" width="150" height="24" rx="8" fill="#151D1A" stroke="#22302C"/>
