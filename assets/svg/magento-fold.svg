  <text x="478" y="66" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">TRAFFIC</text>
  <circle class="live" cx="606" cy="62" r="4" fill="#FF8A6B"/>
  <text x="478" y="96" font-size="20" font-weight="700" fill="#F2F5F4">12.4k</text><text x="540" y="96" font-size="9" fill="#8FA39E">req/s</text>
  <path class="A ar" d="M478 160 L498 150 L516 154 L534 136 L552 142 L570 124 L590 128 L608 112 L608 170 L478 170 Z" fill="url(#gArea)"/>
  <path class="ln" d="M478 160 L498 150 L516 154 L534 136 L552 142 L570 124 L590 128 L608 112" fill="none" stroke="#00D4A3" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
