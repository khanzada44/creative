  <rect x="218" y="118" width="74" height="24" rx="8" fill="#151D1A"/><text x="255" y="133.5" text-anchor="middle" font-size="9" font-weight="600" fill="#C9D6D2">All stores ▾</text>
  <rect x="298" y="118" width="62" height="24" rx="8" fill="#151D1A"/><text x="329" y="133.5" text-anchor="middle" font-size="9" font-weight="600" fill="#C9D6D2">In stock</text>
  <!-- import toast -->
