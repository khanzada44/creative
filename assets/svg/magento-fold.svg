  <!-- header -->
  <g font-size="8" font-weight="600" letter-spacing="1" fill="#5E716C"><text x="62" y="162">SKU</text><text x="128" y="162">PRODUCT</text><text x="262" y="162">STOCK</text><text x="350" y="162">STORES</text></g>
  <rect x="56" y="168" width="376" height="1" fill="#22302C"/>
  <!-- scan highlight -->
  <rect class="A sw" x="56" y="172" width="376" height="28" rx="8" fill="#00D4A3" fill-opacity=".1"/>
  <g font-size="9.5" fill="#E6EEEB">
    <g><text x="62" y="190" fill="#8FA39E" font-size="8.5">CC-1042</text><rect x="128" y="180" width="12" height="12" rx="3" fill="#00D4A3"/><text x="146" y="190">Runner Pro</text><text x="252" y="190" text-anchor="end" font-size="8" fill="#5E716C">12 var</text></g>
    <g><text x="62" y="220" fill="#8FA39E" font-size="8.5">CC-2210</text><rect x="128" y="210" width="12" height="12" rx="3" fill="#9B7BFF"/><text x="146" y="220">Desk Lamp</text><text x="252" y="220" text-anchor="end" font-size="8" fill="#5E716C">4 var</text></g>
    <g><text x="62" y="250" fill="#8FA39E" font-size="8.5">CC-3381</text><rect x="128" y="240" width="12" height="12" rx="3" fill="#FF8A6B"/><text x="146" y="250">Leather Tote</text><text x="252" y="250" text-anchor="end" font-size="8" fill="#5E716C">6 var</text></g>
    <g><text x="62" y="280" fill="#8FA39E" font-size="8.5">CC-4075</text><rect x="128" y="270" width="12" height="12" rx="3" fill="#FFC94D"/><text x="146" y="280">Smart Watch</text><text x="252" y="280" text-anchor="end" font-size="8" fill="#5E716C">9 var</text></g>
  </g>
  <!-- stock bars -->
  <g fill="#1C2623"><rect x="262" y="182" width="72" height="8" rx="4"/><rect x="262" y="212" width="72" height="8" rx="4"/><rect x="262" y="242" width="72" height="8" rx="4"/><rect x="262" y="272" width="72" height="8" rx="4"/></g>
  <g fill="url(#gMint)">
    <rect class="A sb s1" style="--a:.3;--b:.9" x="262" y="182" width="72" height="8" rx="4"/>
    <rect class="A sb s2" style="--a:.6;--b:.75" x="262" y="212" width="72" height="8" rx="4"/>
    <rect class="A sb s3" style="--a:.15;--b:.8" x="262" y="242" width="72" height="8" rx="4"/>
    <rect class="A sb s4" style="--a:.45;--b:.95" x="262" y="272" width="72" height="8" rx="4"/>
  </g>
  <!-- stores -->
  <g font-size="7.5" font-weight="700" text-anchor="middle">
    <g fill="#0F3D33"><rect x="350" y="179" width="22" height="14" rx="7"/><rect x="376" y="179" width="22" height="14" rx="7"/><rect x="402" y="179" width="22" height="14" rx="7"/>
      <rect x="350" y="209" width="22" height="14" rx="7"/><rect x="376" y="209" width="22" height="14" rx="7"/>
      <rect x="350" y="239" width="22" height="14" rx="7"/><rect x="376" y="239" width="22" height="14" rx="7"/><rect x="402" y="239" width="22" height="14" rx="7"/>
      <rect x="350" y="269" width="22" height="14" rx="7"/></g>
    <g fill="#5FF0C8"><text x="361" y="189">US</text><text x="387" y="189">UK</text><text x="413" y="189">AE</text>
      <text x="361" y="219">US</text><text x="387" y="219">PK</text>
      <text x="361" y="249">UK</text><text x="387" y="249">AE</text><text x="413" y="249">PK</text>
      <text x="361" y="279">US</text></g>
  </g>
  <!-- warehouses -->
  <rect x="56" y="300" width="376" height="1" fill="#22302C"/>
  <text x="62" y="320" font-size="8" font-weight="600" letter-spacing="1" fill="#5E716C">WAREHOUSES · SYNCED</text>
  <g font-size="9" font-weight="600" fill="#C9D6D2">
    <rect x="60" y="330" width="116" height="38" rx="10" fill="#151D1A"/><text x="72" y="346">Texas</text><rect x="72" y="354" width="92" height="5" rx="2.5" fill="#22302C"/><rect class="A wb" x="72" y="354" width="92" height="5" rx="2.5" fill="#00D4A3"/>
    <rect x="186" y="330" width="116" height="38" rx="10" fill="#151D1A"/><text x="198" y="346">Dubai</text><rect x="198" y="354" width="92" height="5" rx="2.5" fill="#22302C"/><rect class="A wb w2" x="198" y="354" width="92" height="5" rx="2.5" fill="#9B7BFF"/>
    <rect x="312" y="330" width="116" height="38" rx="10" fill="#151D1A"/><text x="324" y="346">London</text><rect x="324" y="354" width="92" height="5" rx="2.5" fill="#22302C"/><rect class="A wb w3" x="324" y="354" width="92" height="5" rx="2.5" fill="#FFC94D"/>
  </g>
</g>

<!-- ===== traffic ===== -->
<g class="bob2">
