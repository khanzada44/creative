<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FF0C8"/><stop offset="1" stop-color="#00B892"/></linearGradient>
  <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6B4FF"/><stop offset="1" stop-color="#8A68FF"/></linearGradient>
  <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC94D"/><stop offset="1" stop-color="#FF7A57"/></linearGradient>
  <linearGradient id="gHero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03866F"/><stop offset=".55" stop-color="#004337"/><stop offset="1" stop-color="#00211B"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131B18"/><stop offset="1" stop-color="#0C1110"/></linearGradient>
  <radialGradient id="gGlow" cx=".45" cy=".45" r=".5"><stop offset="0" stop-color="#00D4A3" stop-opacity=".26"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <clipPath id="win"><rect x="40" y="70" width="390" height="320" rx="22"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .up,.nt{transform-box:fill-box}
  .A{animation-duration:8s;animation-iteration-count:infinite;animation-fill-mode:backwards}
  .S{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
  .mess{animation-name:mess;animation-timing-function:ease-in}
  @keyframes mess{0%,14%{opacity:1;transform:none}20%,94%{opacity:0;transform:translateX(-30px)}99%,100%{opacity:1;transform:none}}
  .clean{animation-name:clean;animation-timing-function:ease-out}
  @keyframes clean{0%,17%{opacity:0;transform:translateX(-20px)}23%,92%{opacity:1;transform:none}97%,100%{opacity:0;transform:translateX(-20px)}}
  .x1{animation-name:x1}.x2{animation-name:x2}
  @keyframes x1{0%{opacity:1}30%{opacity:0}96%{opacity:1}}
  @keyframes x2{0%{opacity:0}30%{opacity:1}96%{opacity:0}}
  .xp1{animation-name:xp1}.xp2{animation-name:xp2}
  @keyframes xp1{0%{opacity:1}32%{opacity:0}96%{opacity:1}}
  @keyframes xp2{0%{opacity:0}32%{opacity:1}96%{opacity:0}}
  .foc{animation-name:foc}
  @keyframes foc{0%,26%{opacity:0}27%,34%{opacity:1}36%,100%{opacity:0}}
  .flash{animation-name:flash;animation-timing-function:ease-out}
  @keyframes flash{0%,31%{opacity:0}33%{opacity:.9}44%,100%{opacity:0}}
  .i1{animation-name:i1}.i2{animation-name:i2}
  @keyframes i1{0%{opacity:1}41%{opacity:0}96%{opacity:1}}
  @keyframes i2{0%{opacity:0}41%{opacity:1}96%{opacity:0}}
  .ip1{animation-name:ip1}.ip2{animation-name:ip2}
  @keyframes ip1{0%{opacity:1}43%{opacity:0}96%{opacity:1}}
  @keyframes ip2{0%{opacity:0}43%{opacity:1}96%{opacity:0}}
  .tk{animation-name:tk;animation-timing-function:ease-in-out}
  @keyframes tk{0%,50%{transform:translateX(0)}53%,92%{transform:translateX(12px)}96%,100%{transform:translateX(0)}}
  .tt{animation-name:tt}
  @keyframes tt{0%,50%{fill:#2A3632}53%,92%{fill:#00D4A3}96%,100%{fill:#2A3632}}
  .d1{animation-name:d1}.d2{animation-name:d2}
  @keyframes d1{0%{opacity:1}52%{opacity:0}96%{opacity:1}}
  @keyframes d2{0%{opacity:0}52%{opacity:1}96%{opacity:0}}
  .pb1{animation-name:pb1}.pb2{animation-name:pb2}
  @keyframes pb1{0%{opacity:1}60%{opacity:0}96%{opacity:1}}
  @keyframes pb2{0%{opacity:0}60%{opacity:1}96%{opacity:0}}
  .cur{animation-name:cur;animation-timing-function:ease-in-out}
  @keyframes cur{
    0%,18%{transform:translate(280px,250px);opacity:0}22%{opacity:1}
    25%{transform:translate(236px,196px)}27%{transform:translate(236px,196px) scale(.85)}29%{transform:translate(236px,196px) scale(1)}
    38%{transform:translate(228px,250px)}40%{transform:translate(228px,250px) scale(.85)}42%{transform:translate(228px,250px) scale(1)}
    48%{transform:translate(166px,304px)}50%{transform:translate(166px,304px) scale(.85)}52%{transform:translate(166px,304px) scale(1)}
    57%{transform:translate(236px,350px)}59%{transform:translate(236px,350px) scale(.85)}61%{transform:translate(236px,350px) scale(1);opacity:1}
    68%,100%{transform:translate(236px,350px);opacity:0}}
  /* side */
  .m1{animation-name:m1}.m2{animation-name:m2}
  @keyframes m1{0%{opacity:1}20%{opacity:0}96%{opacity:1}}
  @keyframes m2{0%{opacity:0}20%{opacity:1}96%{opacity:0}}
  .q1,.q2,.q3{animation-name:q}
  @keyframes q{0%{fill:#2A3632}100%{fill:#2A3632}}
  .q1{animation-name:qa}.q2{animation-name:qb}.q3{animation-name:qc}
  @keyframes qa{0%{fill:#2A3632}28%{fill:#00D4A3}96%{fill:#2A3632}}
  @keyframes qb{0%{fill:#2A3632}41%{fill:#00D4A3}96%{fill:#2A3632}}
  @keyframes qc{0%{fill:#2A3632}60%{fill:#00D4A3}96%{fill:#2A3632}}
  .nt{transform-origin:50% 50%;animation-name:nt;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
  @keyframes nt{0%,64%{transform:scale(0);opacity:0}70%,92%{transform:scale(1);opacity:1}98%,100%{transform:scale(0);opacity:0}}
  .up{transform-origin:0 50%;animation-name:up;animation-timing-function:ease-in-out}
  @keyframes up{0%,8%{transform:scaleX(0)}40%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .u1{animation-name:ua}.u2{animation-name:ub}
  @keyframes ua{0%{opacity:1}41%{opacity:0}96%{opacity:1}}
  @keyframes ub{0%{opacity:0}41%{opacity:1}96%{opacity:0}}
  .newm{animation-name:newm;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
  @keyframes newm{0%,40%{opacity:0;transform:translateY(-14px)}46%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
  .pk{offset-rotate:0deg;animation:pk 2.6s linear infinite}
  @keyframes pk{0%{offset-distance:0%;opacity:0}12%,88%{opacity:1}100%{offset-distance:100%;opacity:0}}
  .k1{offset-path:path('M498 296 L498 318 L576 318 L576 296')}.k2{offset-path:path('M498 340 L498 352 L576 352 L576 340');animation-delay:-1.3s}
  .bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.mess,.x1,.xp1,.i1,.ip1,.d1,.pb1,.m1,.u1,.cur,.foc,.flash{opacity:0}.up{transform:none}}
</style>

