<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FF0C8"/><stop offset="1" stop-color="#00B892"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131B18"/><stop offset="1" stop-color="#0C1110"/></linearGradient>
  <radialGradient id="gGlow" cx=".45" cy=".45" r=".5"><stop offset="0" stop-color="#00D4A3" stop-opacity=".26"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .hl{opacity:0;animation:hl 6s ease-in-out infinite}
  @keyframes hl{0%,2%{opacity:0}6%,12%{opacity:1}18%,100%{opacity:0}}
  .pkt{offset-path:path("M270 150 V 488");offset-rotate:0deg;animation:pkt 6s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes pkt{0%{offset-distance:0%;opacity:0}4%{opacity:1}58%{offset-distance:100%;opacity:1}62%,100%{offset-distance:100%;opacity:0}}
  .ok{transform-box:fill-box;transform-origin:50% 50%;animation:ok 6s cubic-bezier(.3,1.6,.5,1) infinite}
  @keyframes ok{0%,52%{transform:scale(0)}58%,92%{transform:scale(1)}98%,100%{transform:scale(0)}}
  .typ{clip-path:inset(0 100% 0 0);animation:typ 6s steps(26,end) infinite}
  @keyframes typ{0%,4%{clip-path:inset(0 100% 0 0)}30%,92%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
  .t2{opacity:0;animation:t2 6s steps(1,end) infinite}
  @keyframes t2{0%{opacity:0}34%{opacity:1}96%{opacity:0}}
  .t3{opacity:0;animation:t3 6s steps(1,end) infinite}
  @keyframes t3{0%{opacity:0}42%{opacity:1}96%{opacity:0}}
  .job{transform-box:fill-box;transform-origin:0 50%;animation:job 2.4s ease-in-out infinite}
  @keyframes job{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
  .j2{animation-delay:-.8s}.j3{animation-delay:-1.6s}
  .dbp{offset-path:path("M416 380 C 450 380 456 330 482 330");offset-rotate:0deg;animation:dbp 1.6s ease-in-out infinite alternate}
  @keyframes dbp{from{offset-distance:0%}to{offset-distance:100%}}
  .wire{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  .ms1{animation:ms 6s steps(1,end) infinite}.ms2{opacity:0;animation:ms2 6s steps(1,end) infinite}
  @keyframes ms{0%{opacity:1}55%{opacity:0}95%{opacity:1}}
  @keyframes ms2{0%{opacity:0}55%{opacity:1}95%{opacity:0}}
  .bar{transform-box:fill-box;transform-origin:0 50%;animation:bar 6s cubic-bezier(.2,.8,.2,1) infinite}
  @keyframes bar{0%,50%{transform:scaleX(1)}62%,92%{transform:scaleX(.32)}100%{transform:scaleX(1)}}
  .bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .blink{animation:blink 1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.typ{clip-path:none}.t2,.t3{opacity:1}.hl{opacity:0}}
</style>

<circle cx="290" cy="300" r="300" fill="url(#gGlow)"/>

<!-- lifecycle panel -->
<g filter="url(#soft)"><rect x="100" y="104" width="340" height="404" rx="24" fill="url(#gBoard)" stroke="#22302C"/></g>
<rect x="100" y="104" width="340" height="40" rx="24" fill="#0A0F0E"/><rect x="100" y="124" width="340" height="20" fill="#0A0F0E"/>
<circle cx="124" cy="124" r="5" fill="#FF8A6B"/><circle cx="142" cy="124" r="5" fill="#FFC94D"/><circle cx="160" cy="124" r="5" fill="#00D4A3"/>
<text x="270" y="128" text-anchor="middle" font-size="11" font-weight="500" fill="#8FA39E">request lifecycle</text>
<path d="M270 200 V 212" stroke="#2A3A36" stroke-width="2"/><path d="M270 252 V 264" stroke="#2A3A36" stroke-width="2"/><path d="M270 304 V 316" stroke="#2A3A36" stroke-width="2"/><path d="M270 356 V 368" stroke="#2A3A36" stroke-width="2"/><path d="M270 408 V 420" stroke="#2A3A36" stroke-width="2"/>
  <g>
    <rect x="124" y="160" width="292" height="40" rx="12" fill="#151D1A"/>
    <rect class="hl" style="animation-delay:0.00s" x="124" y="160" width="292" height="40" rx="12" fill="#B39BFF" fill-opacity=".1" stroke="#B39BFF" stroke-width="1.6"/>
    <circle cx="146" cy="180" r="9" fill="#B39BFF" fill-opacity=".18"/><text x="146" y="184" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B39BFF">1</text>
    <text x="164" y="177" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#B39BFF">REQUEST</text>
    <text x="164" y="191" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#C9D6D2">GET /dashboard/orders</text>
  </g>
  <g>
    <rect x="124" y="212" width="292" height="40" rx="12" fill="#151D1A"/>
    <rect class="hl" style="animation-delay:0.55s" x="124" y="212" width="292" height="40" rx="12" fill="#5FF0C8" fill-opacity=".1" stroke="#5FF0C8" stroke-width="1.6"/>
    <circle cx="146" cy="232" r="9" fill="#5FF0C8" fill-opacity=".18"/><text x="146" y="236" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5FF0C8">2</text>
    <text x="164" y="229" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#5FF0C8">ROUTE</text>
    <text x="164" y="243" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#C9D6D2">Route::get(&apos;/orders&apos;)</text>
  </g>
  <g>
    <rect x="124" y="264" width="292" height="40" rx="12" fill="#151D1A"/>
    <rect class="hl" style="animation-delay:1.10s" x="124" y="264" width="292" height="40" rx="12" fill="#FFC94D" fill-opacity=".1" stroke="#FFC94D" stroke-width="1.6"/>
    <circle cx="146" cy="284" r="9" fill="#FFC94D" fill-opacity=".18"/><text x="146" y="288" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFC94D">3</text>
    <text x="164" y="281" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#FFC94D">MIDDLEWARE</text>
    <text x="164" y="295" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#C9D6D2">auth · verified · throttle</text>
  </g>
  <g>
    <rect x="124" y="316" width="292" height="40" rx="12" fill="#151D1A"/>
    <rect class="hl" style="animation-delay:1.65s" x="124" y="316" width="292" height="40" rx="12" fill="#5FF0C8" fill-opacity=".1" stroke="#5FF0C8" stroke-width="1.6"/>
    <circle cx="146" cy="336" r="9" fill="#5FF0C8" fill-opacity=".18"/><text x="146" y="340" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5FF0C8">4</text>
    <text x="164" y="333" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#5FF0C8">CONTROLLER</text>
    <text x="164" y="347" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#C9D6D2">OrderController@index</text>
  </g>
  <g>
    <rect x="124" y="368" width="292" height="40" rx="12" fill="#151D1A"/>
    <rect class="hl" style="animation-delay:2.20s" x="124" y="368" width="292" height="40" rx="12" fill="#FF8A6B" fill-opacity=".1" stroke="#FF8A6B" stroke-width="1.6"/>
    <circle cx="146" cy="388" r="9" fill="#FF8A6B" fill-opacity=".18"/><text x="146" y="392" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FF8A6B">5</text>
    <text x="164" y="385" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#FF8A6B">ELOQUENT</text>
    <text x="164" y="399" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#C9D6D2">Order::with(&apos;items&apos;)-&gt;latest()</text>
  </g>
  <g>
    <rect x="124" y="420" width="292" height="40" rx="12" fill="#151D1A"/>
    <rect class="hl" style="animation-delay:2.75s" x="124" y="420" width="292" height="40" rx="12" fill="#00D4A3" fill-opacity=".1" stroke="#00D4A3" stroke-width="1.6"/>
    <circle cx="146" cy="440" r="9" fill="#00D4A3" fill-opacity=".18"/><text x="146" y="444" text-anchor="middle" font-size="9.5" font-weight="700" fill="#00D4A3">6</text>
    <text x="164" y="437" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#00D4A3">RESPONSE</text>
    <text x="164" y="451" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#C9D6D2">200 OK · JSON · 38ms</text>
  </g>

<g class="pkt"><circle r="7" fill="#F2F5F4"/><circle r="12" fill="#F2F5F4" fill-opacity=".18"/></g>
<g class="ok"><circle cx="400" cy="440" r="10" fill="#00D4A3"/><path d="M395 440 l3.5 3.5 6.5 -7" fill="none" stroke="#04342C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>

<!-- wire to database -->
<path class="wire" d="M416 380 C 450 380 456 330 482 330" fill="none" stroke="#FF8A6B" stroke-opacity=".6" stroke-width="1.6"/>
<circle class="dbp" r="4" fill="#FF8A6B"/>

<!-- card: artisan terminal -->
<g class="bob">
  <g filter="url(#soft)"><rect x="380" y="20" width="244" height="112" rx="18" fill="#0A0F0E" stroke="#22302C"/></g>
  <text x="396" y="46" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">ARTISAN</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="10.5">
    <text class="typ" x="396" y="70"><tspan fill="#5FF0C8">$</tspan><tspan fill="#F2F5F4"> php artisan make:model Order -mc</tspan></text>
    <text class="t2" x="396" y="90" fill="#8FA39E">INFO  Model [Order] created.</text>
    <text class="t3" x="396" y="108" fill="#5FF0C8">✓ Migration + Controller ready<tspan class="blink"> ▌</tspan></text>
  </g>
</g>

<!-- card: database -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="482" y="250" width="142" height="124" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="498" y="276" font-size="10.5" font-weight="600" letter-spacing="2" fill="#FF8A6B">DATABASE</text>
  <g transform="translate(600 272) scale(.8)"><ellipse cx="0" cy="-4" rx="12" ry="4.5" fill="none" stroke="#FF8A6B" stroke-width="2"/><path d="M-12 -4 V10 A12 4.5 0 0 0 12 10 V-4" fill="none" stroke="#FF8A6B" stroke-width="2"/></g>
  <g font-family="Consolas, monospace" font-size="9.5" fill="#C9D6D2">
    <rect x="498" y="288" width="110" height="18" rx="5" fill="#151D1A"/><text x="504" y="301">orders · 12,480</text>
    <rect x="498" y="310" width="110" height="18" rx="5" fill="#151D1A"/><text x="504" y="323">items · 48,902</text>
    <rect x="498" y="332" width="110" height="18" rx="5" fill="#151D1A"/><text x="504" y="345">users · 3,215</text>
  </g>
</g>

<!-- card: queue jobs -->
<g class="bob">
  <g filter="url(#soft)"><rect x="470" y="410" width="154" height="118" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="486" y="436" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">QUEUE</text>
  <g font-size="9" fill="#C9D6D2">
    <text x="486" y="456">SendInvoice</text><rect x="486" y="461" width="122" height="5" rx="2.5" fill="#22302C"/><rect class="job" x="486" y="461" width="122" height="5" rx="2.5" fill="#5FF0C8"/>
    <text x="486" y="482">SyncInventory</text><rect x="486" y="487" width="122" height="5" rx="2.5" fill="#22302C"/><rect class="job j2" x="486" y="487" width="122" height="5" rx="2.5" fill="#B39BFF"/>
    <text x="486" y="508">GenerateReport</text><rect x="486" y="513" width="122" height="5" rx="2.5" fill="#22302C"/><rect class="job j3" x="486" y="513" width="122" height="5" rx="2.5" fill="#FFC94D"/>
  </g>
</g>

<!-- card: security -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="20" y="520" width="212" height="96" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="36" y="546" font-size="10.5" font-weight="600" letter-spacing="2" fill="#FFC94D">SECURITY</text>
  <path d="M206 534 l12 4.5 v8 c0 8 -6 12 -12 14 c-6 -2 -12 -6 -12 -14 v-8z" fill="#FFC94D" fill-opacity=".2" stroke="#FFC94D" stroke-width="1.6"/>
  <g font-size="10" fill="#C9D6D2">
    <circle cx="42" cy="566" r="5" fill="#00D4A3"/><text x="54" y="569.5">Auth &amp; roles</text>
    <circle cx="132" cy="566" r="5" fill="#00D4A3"/><text x="144" y="569.5">2FA</text>
    <circle cx="42" cy="590" r="5" fill="#00D4A3"/><text x="54" y="593.5">CSRF</text>
    <circle cx="132" cy="590" r="5" fill="#00D4A3"/><text x="144" y="593.5">Encrypted</text>
  </g>
</g>

<!-- card: performance -->
<g class="bob">
  <g filter="url(#soft)"><rect x="252" y="528" width="200" height="88" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="268" y="554" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">RESPONSE TIME</text>
  <text class="ms1" x="436" y="554" text-anchor="end" font-size="11" font-weight="700" fill="#FF8A6B">120ms</text>
  <text class="ms2" x="436" y="554" text-anchor="end" font-size="11" font-weight="700" fill="#5FF0C8">38ms ⚡</text>
  <rect x="268" y="568" width="168" height="10" rx="5" fill="#22302C"/>
  <rect class="bar" x="268" y="568" width="168" height="10" rx="5" fill="url(#gMint)"/>
  <text x="268" y="600" font-size="9.5" fill="#8FA39E">Cache · Queues · Eager loading</text>
</g>

<!-- badge -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="20" y="40" width="208" height="40" rx="20" fill="#111614" stroke="#22302C"/></g>
  <rect x="32" y="50" width="62" height="20" rx="10" fill="#FF6F4F"/><text x="63" y="64" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">Laravel</text>
  <text x="104" y="64.5" font-size="12" font-weight="600" fill="#F2F5F4">Custom apps</text>
</g>
</svg>