.f1{animation:fl 6s ease-in-out infinite}.f2{animation:fl 7s ease-in-out -2s infinite}.f3{animation:fl 6.5s ease-in-out -4s infinite}.f4{animation:fl 7.5s ease-in-out -1s infinite}
