  <!-- page canvas -->
  <rect x="136" y="160" width="322" height="310" rx="12" fill="#F6F1E7"/>
  <!-- heading block -->
  <rect class="L sel" x="148" y="172" width="298" height="40" rx="6" fill="none" stroke="#00B892" stroke-width="2"/>
  <g class="L sel"><rect x="152" y="162" width="40" height="14" rx="4" fill="#00B892"/><text x="172" y="172" text-anchor="middle" font-size="7.5" font-weight="700" fill="#FFFFFF">H1</text></g>
  <text class="typ" x="158" y="200" font-size="20" font-weight="700" fill="#04342C">Built to grow.</text>
  <!-- image block -->
  <rect x="148" y="222" width="298" height="96" rx="10" fill="url(#gHero)"/>
  <circle cx="400" cy="262" r="26" fill="url(#gViolet)"/><rect x="368" y="276" width="30" height="30" rx="8" fill="url(#gCoral)"/>
  <rect x="164" y="244" width="120" height="10" rx="5" fill="#F2F5F4"/><rect x="164" y="262" width="90" height="10" rx="5" fill="#F2F5F4"/><rect x="164" y="286" width="56" height="16" rx="8" fill="#5FF0C8"/>
  <!-- columns block -->
  <g fill="#E3DBCB"><rect x="148" y="328" width="94" height="44" rx="8"/><rect x="250" y="328" width="94" height="44" rx="8"/><rect x="352" y="328" width="94" height="44" rx="8"/></g>
  <g fill="#B8AE99"><rect x="158" y="340" width="40" height="6" rx="3"/><rect x="158" y="352" width="64" height="5" rx="2.5"/><rect x="260" y="340" width="40" height="6" rx="3"/><rect x="260" y="352" width="64" height="5" rx="2.5"/><rect x="362" y="340" width="40" height="6" rx="3"/><rect x="362" y="352" width="64" height="5" rx="2.5"/></g>
  <!-- inserter + -->
  <g class="L plus"><circle cx="297" cy="384" r="10" fill="#04342C"/><path d="M297 379 v10 M292 384 h10" stroke="#F2F5F4" stroke-width="2" stroke-linecap="round"/></g>
  <!-- new block appears -->
  <g class="L newb"><rect x="148" y="384" width="298" height="74" rx="10" fill="#FFFFFF" stroke="#E3DBCB"/>
    <rect x="160" y="396" width="44" height="8" rx="4" fill="#00B892"/>
    <rect x="160" y="412" width="180" height="7" rx="3.5" fill="#B8AE99"/><rect x="160" y="424" width="140" height="7" rx="3.5" fill="#B8AE99"/>
    <rect x="358" y="404" width="76" height="26" rx="13" fill="#04342C"/><text x="396" y="421" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5FF0C8">Contact us</text></g>
</g>
<!-- cursor -->
<g class="L cur"><path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 15 L18 15 Z" fill="#F2F5F4" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round"/></g>

