  <text x="250" y="134" text-anchor="middle" font-size="11" font-weight="500" fill="#8FA39E">Edit page · Home</text>
  <g class="u1"><rect x="392" y="120" width="64" height="22" rx="11" fill="#00D4A3"/><text x="424" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="#04342C">Update</text></g>
  <g class="u2"><rect x="392" y="120" width="64" height="22" rx="11" fill="#0F3D33"/><text x="424" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="#5FF0C8">Saved ✓</text></g>
  <!-- admin sidebar -->
