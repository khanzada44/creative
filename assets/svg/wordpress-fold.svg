<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FF0C8"/><stop offset="1" stop-color="#00B892"/></linearGradient>
  <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6B4FF"/><stop offset="1" stop-color="#8A68FF"/></linearGradient>
  <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC94D"/><stop offset="1" stop-color="#FF7A57"/></linearGradient>
  <linearGradient id="gHero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03866F"/><stop offset=".55" stop-color="#004337"/><stop offset="1" stop-color="#00211B"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131B18"/><stop offset="1" stop-color="#0C1110"/></linearGradient>
  <radialGradient id="gGlow" cx=".45" cy=".45" r=".5"><stop offset="0" stop-color="#00D4A3" stop-opacity=".26"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <clipPath id="win"><rect x="80" y="110" width="390" height="370" rx="24"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .newb,.pl,.ring,.upd,.sel{transform-box:fill-box}
  .L{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
  .typ{clip-path:inset(0 100% 0 0);animation:typ 8s steps(14,end) infinite}
  @keyframes typ{0%,4%{clip-path:inset(0 100% 0 0)}20%,94%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
  .newb{transform-origin:50% 0;animation-name:newb;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
  @keyframes newb{0%,30%{transform:scaleY(0);opacity:0}36%,92%{transform:scaleY(1);opacity:1}98%,100%{transform:scaleY(0);opacity:0}}
  .plus{animation-name:plus}
  @keyframes plus{0%,22%{opacity:0}24%,30%{opacity:1}32%,100%{opacity:0}}
  .cur{animation-name:cur;animation-timing-function:ease-in-out}
  @keyframes cur{0%,16%{transform:translate(380px,420px);opacity:0}20%{opacity:1}26%{transform:translate(276px,372px)}28%{transform:translate(276px,372px) scale(.85)}30%{transform:translate(276px,372px) scale(1)}44%{transform:translate(428px,132px)}46%{transform:translate(428px,132px) scale(.85)}48%,60%{transform:translate(428px,132px) scale(1);opacity:1}66%,100%{transform:translate(428px,132px);opacity:0}}
  .u1{animation:u1 8s steps(1,end) infinite}.u2{animation:u2 8s steps(1,end) infinite}
  @keyframes u1{0%{opacity:1}46%{opacity:0}96%{opacity:1}}
  @keyframes u2{0%{opacity:0}46%{opacity:1}96%{opacity:0}}
  .sel{animation-name:sel}
  @keyframes sel{0%,4%{opacity:0}6%,20%{opacity:1}24%,100%{opacity:0}}
  /* plugin cleanup */
  .pl{animation-name:pl}
  @keyframes pl{0%,30%{transform:none;opacity:1}38%,92%{transform:translateX(60px);opacity:0}100%{transform:none;opacity:1}}
  .pl2{animation-delay:.25s}.pl3{animation-delay:.5s}
  .c24{animation:c24 8s steps(1,end) infinite}.c6{animation:c6 8s steps(1,end) infinite}
  @keyframes c24{0%{opacity:1}42%{opacity:0}98%{opacity:1}}
  @keyframes c6{0%{opacity:0}42%{opacity:1}98%{opacity:0}}
  .ring{transform-origin:50% 50%;transform:rotate(-90deg);animation:ring 8s cubic-bezier(.2,.8,.2,1) infinite}
  @keyframes ring{0%,40%{stroke-dasharray:42 100;stroke:#FF8A6B}56%,94%{stroke-dasharray:96 100;stroke:#00D4A3}100%{stroke-dasharray:42 100;stroke:#FF8A6B}}
  .s42{animation:s42 8s steps(1,end) infinite}.s96{animation:s96 8s steps(1,end) infinite}
  @keyframes s42{0%{opacity:1}50%{opacity:0}98%{opacity:1}}
  @keyframes s96{0%{opacity:0}50%{opacity:1}98%{opacity:0}}
  .dot{animation:dotc 8s steps(1,end) infinite}
  @keyframes dotc{0%{fill:#FFC94D}52%{fill:#00D4A3}96%{fill:#FFC94D}}
  .bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.typ{clip-path:none}.u1,.c24,.s42,.plus,.cur,.sel{opacity:0}.pl{opacity:0}.ring{stroke-dasharray:96 100;stroke:#00D4A3}}
</style>

<circle cx="290" cy="300" r="300" fill="url(#gGlow)"/>

<!-- block editor -->
<g filter="url(#soft)"><rect x="80" y="110" width="390" height="370" rx="24" fill="url(#gBoard)" stroke="#22302C"/></g>
<g clip-path="url(#win)">
