<path d="M357.4 161.4 L324.5 240.9" stroke="#FFC94D" stroke-opacity=".28" stroke-width="1.5"/>
<path d="M438.6 242.6 L359.1 275.5" stroke="#FF8A6B" stroke-opacity=".28" stroke-width="1.5"/>

<circle class="pin" style="offset-path:path('M438.6 357.4 L359.1 324.5');animation-delay:0.00s" r="4" fill="#5FF0C8"/>
<circle class="pout" style="offset-path:path('M359.1 324.5 L438.6 357.4');animation-delay:-0.80s" r="3" fill="#F2F5F4"/>
<circle class="pin" style="offset-path:path('M357.4 438.6 L324.5 359.1');animation-delay:-0.37s" r="4" fill="#B39BFF"/>
<circle class="pout" style="offset-path:path('M324.5 359.1 L357.4 438.6');animation-delay:-1.17s" r="3" fill="#F2F5F4"/>
<circle class="pin" style="offset-path:path('M242.6 438.6 L275.5 359.1');animation-delay:-0.74s" r="4" fill="#FFC94D"/>
<circle class="pout" style="offset-path:path('M275.5 359.1 L242.6 438.6');animation-delay:-1.54s" r="3" fill="#F2F5F4"/>
<circle class="pin" style="offset-path:path('M161.4 357.4 L240.9 324.5');animation-delay:-1.11s" r="4" fill="#FF8A6B"/>
<circle class="pout" style="offset-path:path('M240.9 324.5 L161.4 357.4');animation-delay:-1.91s" r="3" fill="#F2F5F4"/>
<circle class="pin" style="offset-path:path('M161.4 242.6 L240.9 275.5');animation-delay:-1.48s" r="4" fill="#5FF0C8"/>
<circle class="pout" style="offset-path:path('M240.9 275.5 L161.4 242.6');animation-delay:-2.28s" r="3" fill="#F2F5F4"/>
<circle class="pin" style="offset-path:path('M242.6 161.4 L275.5 240.9');animation-delay:-1.85s" r="4" fill="#B39BFF"/>
<circle class="pout" style="offset-path:path('M275.5 240.9 L242.6 161.4');animation-delay:-2.65s" r="3" fill="#F2F5F4"/>
<circle class="pin" style="offset-path:path('M357.4 161.4 L324.5 240.9');animation-delay:-2.22s" r="4" fill="#FFC94D"/>
<circle class="pout" style="offset-path:path('M324.5 240.9 L357.4 161.4');animation-delay:-3.02s" r="3" fill="#F2F5F4"/>
<circle class="pin" style="offset-path:path('M438.6 242.6 L359.1 275.5');animation-delay:-2.59s" r="4" fill="#FF8A6B"/>
<circle class="pout" style="offset-path:path('M359.1 275.5 L438.6 242.6');animation-delay:-3.39s" r="3" fill="#F2F5F4"/>


<!-- server core with event loop -->
<g filter="url(#soft)"><circle cx="300" cy="300" r="64" fill="url(#gCore)" stroke="#22302C" stroke-width="1.5"/></g>
<g class="loopring"><circle cx="300" cy="300" r="56" fill="none" stroke="url(#gNode)" stroke-width="5" stroke-linecap="round" stroke-dasharray="250 102"/></g>
<g class="loopring2"><circle cx="300" cy="300" r="46" fill="none" stroke="#5FF0C8" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 8"/></g>
<g class="core">
  <text x="300" y="294" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.5" fill="#8FA39E">EVENT LOOP</text>
  <text x="300" y="313" text-anchor="middle" font-size="12.5" font-weight="700" fill="#F2F5F4">non-blocking</text>
</g>

<g transform="translate(438.6 357.4)"><g class="cl" style="animation-delay:0.0s"><circle r="20" fill="#5FF0C8"/><circle r="26" fill="none" stroke="#5FF0C8" stroke-opacity=".25" stroke-width="2"/><circle cx="0" cy="-4" r="5" fill="#0A0A0A"/><path d="M-8 9 a8 7 0 0 1 16 0z" fill="#0A0A0A"/></g></g>
<g transform="translate(357.4 438.6)"><g class="cl" style="animation-delay:-0.5s"><circle r="20" fill="#B39BFF"/><circle r="26" fill="none" stroke="#B39BFF" stroke-opacity=".25" stroke-width="2"/><rect x="-6" y="-10" width="12" height="20" rx="3" fill="none" stroke="#0A0A0A" stroke-width="2"/><circle cx="0" cy="6" r="1.4" fill="#0A0A0A"/></g></g>
<g transform="translate(242.6 438.6)"><g class="cl" style="animation-delay:-1.0s"><circle r="20" fill="#FFC94D"/><circle r="26" fill="none" stroke="#FFC94D" stroke-opacity=".25" stroke-width="2"/><circle cx="0" cy="-4" r="5" fill="#0A0A0A"/><path d="M-8 9 a8 7 0 0 1 16 0z" fill="#0A0A0A"/></g></g>
<g transform="translate(161.4 357.4)"><g class="cl" style="animation-delay:-1.5s"><circle r="20" fill="#FF8A6B"/><circle r="26" fill="none" stroke="#FF8A6B" stroke-opacity=".25" stroke-width="2"/><rect x="-9" y="-8" width="18" height="12" rx="2" fill="none" stroke="#0A0A0A" stroke-width="2"/><path d="M-12 7 h24" stroke="#0A0A0A" stroke-width="2.4" stroke-linecap="round"/></g></g>
<g transform="translate(161.4 242.6)"><g class="cl" style="animation-delay:-2.0s"><circle r="20" fill="#5FF0C8"/><circle r="26" fill="none" stroke="#5FF0C8" stroke-opacity=".25" stroke-width="2"/><circle cx="0" cy="-4" r="5" fill="#0A0A0A"/><path d="M-8 9 a8 7 0 0 1 16 0z" fill="#0A0A0A"/></g></g>
<g transform="translate(242.6 161.4)"><g class="cl" style="animation-delay:-2.5s"><circle r="20" fill="#B39BFF"/><circle r="26" fill="none" stroke="#B39BFF" stroke-opacity=".25" stroke-width="2"/><rect x="-6" y="-10" width="12" height="20" rx="3" fill="none" stroke="#0A0A0A" stroke-width="2"/><circle cx="0" cy="6" r="1.4" fill="#0A0A0A"/></g></g>
<g transform="translate(357.4 161.4)"><g class="cl" style="animation-delay:-3.0s"><circle r="20" fill="#FFC94D"/><circle r="26" fill="none" stroke="#FFC94D" stroke-opacity=".25" stroke-width="2"/><circle cx="0" cy="-4" r="5" fill="#0A0A0A"/><path d="M-8 9 a8 7 0 0 1 16 0z" fill="#0A0A0A"/></g></g>
<g transform="translate(438.6 242.6)"><g class="cl" style="animation-delay:-3.5s"><circle r="20" fill="#FF8A6B"/><circle r="26" fill="none" stroke="#FF8A6B" stroke-opacity=".25" stroke-width="2"/><rect x="-9" y="-8" width="18" height="12" rx="2" fill="none" stroke="#0A0A0A" stroke-width="2"/><path d="M-12 7 h24" stroke="#0A0A0A" stroke-width="2.4" stroke-linecap="round"/></g></g>


<!-- card: live chat (websocket) -->
<g class="bob">
  <g filter="url(#soft)"><rect x="438" y="16" width="186" height="140" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="454" y="42" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">LIVE · WEBSOCKET</text>
  <circle class="st" cx="608" cy="38" r="4" fill="#5FF0C8"/>
  <g class="msg"><rect x="454" y="54" width="112" height="22" rx="11" fill="#151D1A"/><text x="464" y="69" font-size="9.5" fill="#C9D6D2">Order #1024 placed</text></g>
  <g class="msg m2"><rect x="496" y="82" width="112" height="22" rx="11" fill="#0F3D33"/><text x="506" y="97" font-size="9.5" fill="#5FF0C8">Driver 2 min away</text></g>
  <g class="msg m3"><rect x="454" y="110" width="92" height="22" rx="11" fill="#151D1A"/><text x="464" y="125" font-size="9.5" fill="#C9D6D2">Stock: 3 left</text></g>
  <g class="typing" transform="translate(586 142)"><circle cx="0" r="2.6" fill="#8FA39E"/><circle cx="8" r="2.6" fill="#8FA39E"/><circle cx="16" r="2.6" fill="#8FA39E"/></g>
</g>

<!-- card: API -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="16" y="474" width="206" height="128" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="32" y="500" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">REST API</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="10">
    <rect x="32" y="510" width="174" height="22" rx="7" fill="#151D1A"/><text x="40" y="525"><tspan fill="#5FF0C8" font-weight="700">GET </tspan><tspan fill="#C9D6D2">/api/orders</tspan></text><text class="st" x="198" y="525" text-anchor="end" fill="#5FF0C8">200</text>
    <rect x="32" y="538" width="174" height="22" rx="7" fill="#151D1A"/><text x="40" y="553"><tspan fill="#FFC94D" font-weight="700">POST</tspan><tspan fill="#C9D6D2"> /api/auth</tspan></text><text class="st s2" x="198" y="553" text-anchor="end" fill="#5FF0C8">201</text>
    <rect x="32" y="566" width="174" height="22" rx="7" fill="#151D1A"/><text x="40" y="581"><tspan fill="#B39BFF" font-weight="700">PUT </tspan><tspan fill="#C9D6D2">/api/cart</tspan></text><text class="st s3" x="198" y="581" text-anchor="end" fill="#5FF0C8">200</text>
  </g>
</g>

<!-- card: metrics -->
<g class="bob">
  <g filter="url(#soft)"><rect x="404" y="486" width="220" height="116" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="420" y="512" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">PERFORMANCE</text>
  <g>
    <text x="420" y="540" font-size="16" font-weight="700" fill="#F2F5F4">12.4K</text><text x="420" y="554" font-size="8.5" fill="#8FA39E">requests / sec</text>
    <text x="494" y="540" font-size="16" font-weight="700" fill="#F2F5F4">18ms</text><text x="494" y="554" font-size="8.5" fill="#8FA39E">avg latency</text>
    <text x="556" y="540" font-size="16" font-weight="700" fill="#5FF0C8">99.9%</text><text x="556" y="554" font-size="8.5" fill="#8FA39E">uptime</text>
  </g>
  <path class="spark" pathLength="1" d="M420 594 L440 589 L456 591 L474 584 L492 586 L510 579 L530 581 L548 575 L568 577 L588 570 L606 572" fill="none" stroke="url(#gMint)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- card: auth -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="16" y="196" width="118" height="96" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="32" y="222" font-size="10.5" font-weight="600" letter-spacing="2" fill="#FFC94D">AUTH</text>
  <rect x="32" y="232" width="86" height="20" rx="6" fill="#151D1A"/><text x="40" y="246" font-family="Consolas, monospace" font-size="9" fill="#C9D6D2">JWT · eyJh…</text>
  <circle cx="40" cy="270" r="5" fill="#00D4A3"/><text x="50" y="273.5" font-size="9.5" fill="#C9D6D2">Verified</text>
</g>

<!-- badge -->
<g class="bob">
  <g filter="url(#soft)"><rect x="16" y="40" width="204" height="40" rx="20" fill="#111614" stroke="#22302C"/></g>
  <rect x="28" y="50" width="62" height="20" rx="10" fill="#5FA04E"/><text x="59" y="64" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">Node.js</text>
  <text x="100" y="64.5" font-size="12" font-weight="600" fill="#F2F5F4">Real-time apps</text>
</g>
</svg>