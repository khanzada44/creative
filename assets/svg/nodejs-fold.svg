<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gNode" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD86A"/><stop offset="1" stop-color="#3F8A33"/></linearGradient>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FF0C8"/><stop offset="1" stop-color="#00B892"/></linearGradient>
  <radialGradient id="gGlow" cx=".47" cy=".47" r=".5"><stop offset="0" stop-color="#00D4A3" stop-opacity=".28"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <radialGradient id="gCore" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#1B2925"/><stop offset="1" stop-color="#0C1110"/></radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .pin{offset-rotate:0deg;animation:pin 2.4s ease-in infinite}
  @keyframes pin{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
  .pout{offset-rotate:0deg;animation:pout 2.4s ease-out infinite}
  @keyframes pout{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
  .loopring{transform-box:fill-box;transform-origin:50% 50%;animation:spin 3s linear infinite}
  .loopring2{transform-box:fill-box;transform-origin:50% 50%;animation:spin 7s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .orbit{transform-box:view-box;transform-origin:300px 300px;animation:spin 40s linear infinite}
  .cl{transform-box:fill-box;transform-origin:50% 50%;animation:cl 2.4s ease-in-out infinite}
  @keyframes cl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .core{transform-box:fill-box;transform-origin:50% 50%;animation:core 1.2s ease-in-out infinite}
  @keyframes core{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .msg{opacity:0;animation:msg 6s ease-out infinite}
  .m2{animation-delay:1.2s}.m3{animation-delay:2.4s}
  @keyframes msg{0%{opacity:0;transform:translateY(10px)}8%,80%{opacity:1;transform:none}92%,100%{opacity:0}}
  .typing circle{animation:dot 1s ease-in-out infinite}
  .typing circle:nth-child(2){animation-delay:.15s}.typing circle:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
  .spark{stroke-dasharray:1;stroke-dashoffset:1;animation:spark 3s ease-in-out infinite}
  @keyframes spark{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
  .st{animation:st 1.6s ease-in-out infinite}
  .s2{animation-delay:-.5s}.s3{animation-delay:-1s}
  @keyframes st{0%,100%{opacity:.55}50%{opacity:1}}
  .bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.msg{opacity:1}.spark{stroke-dashoffset:0}.pin,.pout{opacity:0}}
</style>

<circle cx="300" cy="300" r="300" fill="url(#gGlow)"/>

<!-- orbit rings -->
<g class="orbit" fill="none" stroke="#5FF0C8" stroke-opacity=".18"><circle cx="300" cy="300" r="150" stroke-dasharray="2 8"/></g>
<circle cx="300" cy="300" r="104" fill="none" stroke="#5FF0C8" stroke-opacity=".08"/>

<path d="M438.6 357.4 L359.1 324.5" stroke="#5FF0C8" stroke-opacity=".28" stroke-width="1.5"/>
<path d="M357.4 438.6 L324.5 359.1" stroke="#B39BFF" stroke-opacity=".28" stroke-width="1.5"/>
<path d="M242.6 438.6 L275.5 359.1" stroke="#FFC94D" stroke-opacity=".28" stroke-width="1.5"/>
