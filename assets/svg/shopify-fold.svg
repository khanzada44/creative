    <text x="388" y="364" text-anchor="end" font-size="9" fill="#8A8273">1 item · $64</text>
    <g font-size="9.5" font-weight="600" fill="#04342C">
      <rect x="232" y="376" width="156" height="26" rx="9" fill="#F6F1E7" stroke="#00B892"/><circle cx="246" cy="389" r="5" fill="none" stroke="#04342C" stroke-width="1.4"/><text x="258" y="392.5">Card</text>
      <rect x="232" y="408" width="156" height="26" rx="9" fill="#F6F1E7"/><circle cx="246" cy="421" r="5" fill="none" stroke="#04342C" stroke-width="1.4"/><text x="258" y="424.5">Wallet pay</text>
      <rect x="232" y="440" width="156" height="26" rx="9" fill="#F6F1E7"/><circle cx="246" cy="453" r="5" fill="none" stroke="#04342C" stroke-width="1.4"/><text x="258" y="456.5">Pay later</text>
    </g>
    <circle class="S rad" cx="246" cy="389" r="2.8" fill="#00B892"/>
    <g class="S p1"><rect x="232" y="478" width="156" height="36" rx="18" fill="#04342C"/><text x="310" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#5FF0C8">Pay $64</text></g>
    <g class="S p2"><rect x="232" y="478" width="156" height="36" rx="18" fill="#00D4A3"/><text x="310" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#04342C">Order confirmed ✓</text></g>
    <text x="310" y="532" text-anchor="middle" font-size="7.5" fill="#8A8273">🔒 Secure checkout</text>
  </g>
</g>
