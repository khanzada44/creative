  <!-- trust -->
  <rect x="232" y="347" width="70" height="17" rx="8.5" fill="#E2F6EF"/><text x="267" y="358.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#00866F">Free shipping</text>
  <rect x="306" y="347" width="80" height="17" rx="8.5" fill="#E2F6EF"/><text x="346" y="358.5" text-anchor="middle" font-size="7.5" font-weight="600" fill="#00866F">30-day returns</text>
  <!-- sizes -->
  <g fill="#EDE6D8"><rect x="232" y="374" width="28" height="22" rx="8"/><rect x="266" y="374" width="28" height="22" rx="8"/><rect x="300" y="374" width="28" height="22" rx="8"/></g>
  <g font-size="9" font-weight="700" fill="#04342C" text-anchor="middle"><text x="246" y="388.5">S</text><text x="280" y="388.5">M</text><text x="314" y="388.5">L</text></g>
  <rect class="A szr" x="232" y="374" width="28" height="22" rx="8" fill="none" stroke="#00B892" stroke-width="2"/>
  <!-- add to cart -->
  <rect x="232" y="410" width="156" height="38" rx="19" fill="#04342C"/>
