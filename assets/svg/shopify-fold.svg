<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FF0C8"/><stop offset="1" stop-color="#00B892"/></linearGradient>
  <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6B4FF"/><stop offset="1" stop-color="#8A68FF"/></linearGradient>
  <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC94D"/><stop offset="1" stop-color="#FF7A57"/></linearGradient>
  <radialGradient id="gGlow" cx=".5" cy=".48" r=".5"><stop offset="0" stop-color="#00D4A3" stop-opacity=".28"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <clipPath id="scr"><rect x="220" y="74" width="180" height="512" rx="27"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .jl,.bar{transform-box:fill-box}
  .A{animation-duration:8s;animation-iteration-count:infinite}
  .S{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
  .v1{animation-name:v1}.v2{animation-name:v2}
  @keyframes v1{0%{opacity:1}9%{opacity:0}96%{opacity:1}}
  @keyframes v2{0%{opacity:0}9%{opacity:1}96%{opacity:0}}
  .swr{animation-name:swr;animation-timing-function:ease-in-out}
  @keyframes swr{0%,6%{transform:translateX(0)}10%,92%{transform:translateX(20px)}98%,100%{transform:translateX(0)}}
  .szr{animation-name:szr;animation-timing-function:ease-in-out}
  @keyframes szr{0%,16%{transform:translateX(0)}20%,92%{transform:translateX(34px)}98%,100%{transform:translateX(0)}}
  .ac1{animation-name:ac1}.ac2{animation-name:ac2}
  @keyframes ac1{0%{opacity:1}29%{opacity:0}96%{opacity:1}}
  @keyframes ac2{0%{opacity:0}29%{opacity:1}96%{opacity:0}}
  .bdg{animation-name:ac2}
  .sheet{animation-name:sheet;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
  @keyframes sheet{0%,32%{transform:translateY(270px)}40%,90%{transform:translateY(0)}97%,100%{transform:translateY(270px)}}
  .dim{animation-name:dim}
  @keyframes dim{0%,32%{opacity:0}40%,90%{opacity:.4}97%,100%{opacity:0}}
  .rad{animation-name:rad}
  @keyframes rad{0%{opacity:0}44%{opacity:1}96%{opacity:0}}
  .p1{animation-name:p1}.p2{animation-name:p2}
  @keyframes p1{0%{opacity:1}57%{opacity:0}96%{opacity:1}}
  @keyframes p2{0%{opacity:0}57%{opacity:1}96%{opacity:0}}
  .touch{animation-name:touch;animation-timing-function:ease-in-out}
  @keyframes touch{
    0%,2%{transform:translate(330px,240px);opacity:0}
    6%{transform:translate(310px,294px);opacity:.95}8%{transform:translate(310px,294px) scale(.75)}10%{transform:translate(310px,294px) scale(1)}
    16%{transform:translate(266px,385px)}18%{transform:translate(266px,385px) scale(.75)}20%{transform:translate(266px,385px) scale(1)}
    26%{transform:translate(310px,429px)}28%{transform:translate(310px,429px) scale(.75)}30%{transform:translate(310px,429px) scale(1)}
    41%{transform:translate(300px,389px)}43%{transform:translate(300px,389px) scale(.75)}45%{transform:translate(300px,389px) scale(1)}
    53%{transform:translate(310px,496px)}55%{transform:translate(310px,496px) scale(.75)}57%{transform:translate(310px,496px) scale(1);opacity:.95}
    64%,100%{transform:translate(310px,496px);opacity:0}}
  /* side cards */
  .tk{animation-name:tk;animation-timing-function:ease-in-out}
  @keyframes tk{0%,20%{transform:translateX(0)}24%,92%{transform:translateX(10px)}96%,100%{transform:translateX(0)}}
  .tt{animation-name:tt;animation-timing-function:ease-in-out}
  @keyframes tt{0%,20%{fill:#2A3632}24%,92%{fill:#00D4A3}96%,100%{fill:#2A3632}}
  .j2{animation-name:j2}.j3{animation-name:j3}.j4{animation-name:j4}
  @keyframes j2{0%{fill:#2A3632}10%{fill:#00D4A3}96%{fill:#2A3632}}
  @keyframes j3{0%{fill:#2A3632}30%{fill:#00D4A3}96%{fill:#2A3632}}
  @keyframes j4{0%{fill:#2A3632}57%{fill:#00D4A3}96%{fill:#2A3632}}
  .jl{transform-origin:50% 0;animation-name:jl}
  @keyframes jl{0%{transform:scaleY(0)}10%{transform:scaleY(.33)}30%{transform:scaleY(.66)}57%,92%{transform:scaleY(1)}98%,100%{transform:scaleY(0)}}
  .cv1{animation-name:cv1}.cv2{animation-name:cv2}
  @keyframes cv1{0%{opacity:1}60%{opacity:0}97%{opacity:1}}
  @keyframes cv2{0%{opacity:0}60%{opacity:1}97%{opacity:0}}
  .bar{transform-origin:50% 100%;animation-name:bar;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
  @keyframes bar{0%,50%{transform:scaleY(.35)}66%,92%{transform:scaleY(1)}100%{transform:scaleY(.35)}}
  .b2{animation-delay:.1s}.b3{animation-delay:.2s}.b4{animation-delay:.3s}.b5{animation-delay:.4s}.b6{animation-delay:.5s}
  .k1,.k2,.k3,.k4{animation-name:k}
  @keyframes k{0%,8%{opacity:0}14%,92%{opacity:1}98%,100%{opacity:0}}
  .k2{animation-delay:.4s}.k3{animation-delay:.8s}.k4{animation-delay:1.2s}
  .r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}
  @keyframes r1{0%,4%{opacity:0}8%,92%{opacity:1}98%,100%{opacity:0}}
  @keyframes r2{0%,30%{opacity:0}35%,92%{opacity:1}98%,100%{opacity:0}}
  @keyframes r3{0%,58%{opacity:0}63%,92%{opacity:1}98%,100%{opacity:0}}
  .bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.touch,.v2,.ac2,.bdg,.dim,.cv1{opacity:0}.sheet{transform:translateY(270px)}.jl,.bar{transform:none}}
</style>

<circle cx="320" cy="320" r="310" fill="url(#gGlow)"/>

<!-- ===== phone ===== -->
<g filter="url(#soft)"><rect x="212" y="66" width="196" height="528" rx="34" fill="#0B0F0E" stroke="#22302C" stroke-width="1.5"/></g>
<rect x="220" y="74" width="180" height="512" rx="27" fill="#F6F1E7"/>
