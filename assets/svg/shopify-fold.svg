  <text class="S ac2" x="310" y="433" text-anchor="middle" font-size="11" font-weight="700" fill="#5FF0C8">Added ✓</text>
  <!-- upsell -->
  <text x="232" y="474" font-size="8.5" font-weight="600" fill="#8A8273">Pairs well with</text>
  <rect x="232" y="482" width="74" height="58" rx="10" fill="#EDE6D8"/><rect x="314" y="482" width="74" height="58" rx="10" fill="#EDE6D8"/>
  <circle cx="269" cy="506" r="14" fill="url(#gCoral)"/><rect x="336" y="494" width="30" height="26" rx="6" fill="url(#gViolet)"/>
  <rect x="232" y="548" width="74" height="6" rx="3" fill="#D8CFBD"/><rect x="314" y="548" width="74" height="6" rx="3" fill="#D8CFBD"/>
  <!-- checkout sheet -->
  <rect class="A dim" x="220" y="74" width="180" height="512" fill="#04342C" opacity="0"/>
  <g class="A sheet">
    <rect x="220" y="330" width="180" height="270" rx="22" fill="#FFFFFF"/>
    <rect x="292" y="338" width="36" height="4" rx="2" fill="#D8CFBD"/>
