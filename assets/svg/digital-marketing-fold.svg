<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FF0C8"/><stop offset="1" stop-color="#00B892"/></linearGradient>
  <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6B4FF"/><stop offset="1" stop-color="#8A68FF"/></linearGradient>
  <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC94D"/><stop offset="1" stop-color="#FF7A57"/></linearGradient>
  <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00D4A3" stop-opacity=".35"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131B18"/><stop offset="1" stop-color="#0C1110"/></linearGradient>
  <radialGradient id="gGlow" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#00D4A3" stop-opacity=".26"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <clipPath id="dash"><rect x="100" y="120" width="440" height="356" rx="24"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .bar,.fun,.pop,.heart,.fly,.area{transform-box:fill-box}
  .loop{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
  .line{stroke-dasharray:1;stroke-dashoffset:1;animation-name:line}
  @keyframes line{0%,8%{stroke-dashoffset:1;opacity:1}38%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
  .area{animation-name:area}
  @keyframes area{0%,30%{opacity:0}42%,90%{opacity:1}97%,100%{opacity:0}}
  .dot{animation-name:dotin}
  @keyframes dotin{0%,36%{opacity:0}40%,90%{opacity:1}97%,100%{opacity:0}}
  .bar{transform-origin:50% 100%;animation-name:bar}
  @keyframes bar{0%,10%{transform:scaleY(0)}24%,90%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}
  .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}
  .fun{transform-origin:50% 50%;animation-name:fun}
  @keyframes fun{0%,14%{transform:scaleX(0)}26%,90%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
  .f2{animation-delay:.2s}.f3{animation-delay:.4s}
  .pop{transform-origin:50% 50%;animation-name:pop}
  @keyframes pop{0%,4%{transform:scale(.6);opacity:0}10%{transform:scale(1.05);opacity:1}13%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(.9);opacity:0}}
  .k2{animation-delay:.15s}.k3{animation-delay:.3s}
  .up{animation:up 1.6s ease-in-out infinite}
  @keyframes up{0%,100%{transform:translateY(1px)}50%{transform:translateY(-2px)}}
  /* SEO rank climbs 7 -> 3 -> 1 */
  .r7{animation:r7 8s steps(1,end) infinite}.r3{animation:r3 8s steps(1,end) infinite}.r1{animation:r1 8s steps(1,end) infinite}
  @keyframes r7{0%{opacity:1}30%{opacity:0}}
  @keyframes r3{0%{opacity:0}30%{opacity:1}55%{opacity:0}}
  @keyframes r1{0%{opacity:0}55%{opacity:1}}
  .climb{animation:climb 8s cubic-bezier(.2,.8,.2,1) infinite}
  @keyframes climb{0%,26%{transform:translateY(24px)}32%,52%{transform:translateY(12px)}58%,100%{transform:translateY(0)}}
  /* social likes */
  .heart{transform-origin:50% 50%;animation:heart 2s ease-in-out infinite}
  @keyframes heart{0%,60%,100%{transform:scale(1)}70%{transform:scale(1.35)}80%{transform:scale(.95)}}
  .fly{animation:fly 2.4s ease-out infinite}
  @keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(14px,-46px) scale(1);opacity:0}}
  .fly2{animation-delay:-.8s}.fly3{animation-delay:-1.6s}
  /* PPC cursor click */
  .click{animation:click 3s ease-in-out infinite}
  @keyframes click{0%,30%{transform:translate(30px,26px);opacity:0}40%{opacity:1}55%{transform:translate(0,0)}60%{transform:translate(0,0) scale(.85)}66%,85%{transform:translate(0,0) scale(1);opacity:1}100%{opacity:0}}
  .ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 3s ease-out infinite}
  @keyframes ring{0%,58%{transform:scale(.3);opacity:0}62%{opacity:.8}80%,100%{transform:scale(2.2);opacity:0}}
  .bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}.r7,.r3{opacity:0}}
</style>

<circle cx="320" cy="300" r="300" fill="url(#gGlow)"/>

<!-- dashboard -->
<g filter="url(#soft)"><rect x="100" y="120" width="440" height="356" rx="24" fill="url(#gBoard)" stroke="#22302C"/></g>
<g clip-path="url(#dash)">
  <rect x="100" y="120" width="440" height="36" fill="#0A0F0E"/>
  <circle cx="124" cy="138" r="5" fill="#FF8A6B"/><circle cx="142" cy="138" r="5" fill="#FFC94D"/><circle cx="160" cy="138" r="5" fill="#00D4A3"/>
  <text x="320" y="142" text-anchor="middle" font-size="11" font-weight="500" fill="#8FA39E">campaign-dashboard · last 30 days</text>
  

  <!-- KPI tiles -->
  <g class="loop pop"><rect x="120" y="168" width="128" height="54" rx="12" fill="#151D1A"/>
    <text x="132" y="186" font-size="9.5" fill="#8FA39E">Visitors</text>
    <text x="132" y="210" font-size="17" font-weight="700" fill="#F2F5F4">48.2K</text>
    <g class="up"><text x="236" y="210" text-anchor="end" font-size="10" font-weight="700" fill="#5FF0C8">▲ 24%</text></g></g>
  <g class="loop pop k2"><rect x="256" y="168" width="128" height="54" rx="12" fill="#151D1A"/>
    <text x="268" y="186" font-size="9.5" fill="#8FA39E">Leads</text>
    <text x="268" y="210" font-size="17" font-weight="700" fill="#F2F5F4">1,284</text>
    <g class="up" style="animation-delay:-.4s"><text x="372" y="210" text-anchor="end" font-size="10" font-weight="700" fill="#5FF0C8">▲ 31%</text></g></g>
  <g class="loop pop k3"><rect x="392" y="168" width="128" height="54" rx="12" fill="#151D1A"/>
    <text x="404" y="186" font-size="9.5" fill="#8FA39E">Return on ad spend</text>
    <text x="404" y="210" font-size="17" font-weight="700" fill="#F2F5F4">4.6x</text>
    <g class="up" style="animation-delay:-.8s"><text x="508" y="210" text-anchor="end" font-size="10" font-weight="700" fill="#FFC94D">▲ 18%</text></g></g>

  <!-- growth chart -->
  <rect x="120" y="232" width="264" height="124" rx="12" fill="#111816"/>
  <text x="132" y="250" font-size="9.5" font-weight="600" letter-spacing="1" fill="#8FA39E">TRAFFIC GROWTH</text>
  <g stroke="#22302C" stroke-width="1"><path d="M132 280 H372 M132 306 H372 M132 332 H372"/></g>
  <path class="loop area" d="M132 336 L168 328 L204 318 L240 322 L276 300 L312 290 L348 270 L372 262 V346 H132 Z" fill="url(#gArea)"/>
  <path class="loop line" pathLength="1" d="M132 336 L168 328 L204 318 L240 322 L276 300 L312 290 L348 270 L372 262" fill="none" stroke="#5FF0C8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="loop dot"><circle cx="372" cy="262" r="5" fill="#0A0A0A" stroke="#5FF0C8" stroke-width="2.4"/></g>

  <!-- funnel -->
  <rect x="392" y="232" width="128" height="124" rx="12" fill="#111816"/>
  <text x="404" y="250" font-size="9.5" font-weight="600" letter-spacing="1" fill="#8FA39E">CONVERSION</text>
  <rect class="loop fun" x="404" y="262" width="104" height="18" rx="6" fill="url(#gMint)"/>
  <rect class="loop fun f2" x="418" y="288" width="76" height="18" rx="6" fill="url(#gViolet)"/>
  <rect class="loop fun f3" x="432" y="314" width="48" height="18" rx="6" fill="url(#gCoral)"/>
  <g font-size="8.5" font-weight="600" fill="#0A0A0A" text-anchor="middle"><text x="456" y="275">Clicks</text><text x="456" y="301">Leads</text><text x="456" y="327">Sales</text></g>
  <text x="456" y="348" text-anchor="middle" font-size="9" fill="#5FF0C8">CVR 5.2%</text>

  <!-- channel bars -->
  <rect x="120" y="366" width="400" height="94" rx="12" fill="#111816"/>
  <text x="132" y="384" font-size="9.5" font-weight="600" letter-spacing="1" fill="#8FA39E">BY CHANNEL</text>
  <g>
    <rect class="loop bar" x="160" y="404" width="34" height="40" rx="6" fill="url(#gMint)"/>
    <rect class="loop bar b2" x="252" y="414" width="34" height="30" rx="6" fill="url(#gViolet)"/>
    <rect class="loop bar b3" x="344" y="396" width="34" height="48" rx="6" fill="url(#gCoral)"/>
    <rect class="loop bar b4" x="436" y="420" width="34" height="24" rx="6" fill="#F2F5F4" fill-opacity=".85"/>
  </g>
  <g font-size="9" fill="#8FA39E" text-anchor="middle"><text x="177" y="456">Search</text><text x="269" y="456">Social</text><text x="361" y="456">Ads</text><text x="453" y="456">Email</text></g>
</g>

<!-- card: SEO search -->
<g class="bob">
  <g filter="url(#soft)"><rect x="18" y="24" width="232" height="118" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="34" y="50" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">SEO · AI SEARCH</text>
  <rect x="34" y="60" width="200" height="24" rx="12" fill="#151D1A"/>
  <circle cx="48" cy="72" r="4.5" fill="none" stroke="#8FA39E" stroke-width="1.6"/><path d="M51.5 75.5 l3 3" stroke="#8FA39E" stroke-width="1.6" stroke-linecap="round"/>
  <text x="60" y="76" font-size="9.5" fill="#C9D6D2">web design agency texas</text>
  <svg x="34" y="92" width="200" height="40" viewBox="0 0 200 40" overflow="hidden">
    <g class="climb">
      <rect x="0" y="0" width="200" height="22" rx="8" fill="#0F3D33"/>
      <text x="30" y="15" font-size="9.5" font-weight="600" fill="#F2F5F4">yourbrand.com · Web Design</text>
      <rect x="0" y="26" width="200" height="10" rx="5" fill="#151D1A"/>
    </g>
    <rect x="0" y="0" width="24" height="22" rx="8" fill="#00D4A3"/>
    <text class="r7" x="12" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#04342C">#7</text>
    <text class="r3" x="12" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#04342C">#3</text>
    <text class="r1" x="12" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#04342C">#1</text>
  </svg>
</g>

<!-- card: social -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="452" y="18" width="170" height="124" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="468" y="44" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">SOCIAL</text>
  <rect x="468" y="54" width="70" height="70" rx="12" fill="url(#gViolet)"/>
  <circle cx="490" cy="80" r="10" fill="#F2F5F4" fill-opacity=".9"/><path d="M474 118 L496 92 L512 108 L522 98 L534 118 Z" fill="#04342C" fill-opacity=".6"/>
  <g transform="translate(570 90)">
    <path class="fly" d="M0 4 C -6 0 -8 -4 -5 -7 C -3 -9 0 -8 0 -5 C 0 -8 3 -9 5 -7 C 8 -4 6 0 0 4Z" fill="#FF8A6B"/>
    <path class="fly fly2" d="M0 4 C -6 0 -8 -4 -5 -7 C -3 -9 0 -8 0 -5 C 0 -8 3 -9 5 -7 C 8 -4 6 0 0 4Z" fill="#5FF0C8"/>
    <path class="fly fly3" d="M0 4 C -6 0 -8 -4 -5 -7 C -3 -9 0 -8 0 -5 C 0 -8 3 -9 5 -7 C 8 -4 6 0 0 4Z" fill="#FFC94D"/>
  </g>
  <g transform="translate(560 106)"><path class="heart" d="M0 8 C -12 0 -15 -8 -10 -13 C -6 -17 0 -15 0 -10 C 0 -15 6 -17 10 -13 C 15 -8 12 0 0 8Z" fill="#FF8A6B"/></g>
  <text x="586" y="112" font-size="11" font-weight="700" fill="#F2F5F4">+2.4K</text>
</g>

<!-- card: PPC -->
<g class="bob">
  <g filter="url(#soft)"><rect x="446" y="500" width="176" height="100" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="462" y="526" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">PAID ADS</text>
  <rect x="462" y="536" width="22" height="14" rx="4" fill="#FFC94D"/><text x="473" y="546.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0A0A0A">Ad</text>
  <rect x="490" y="539" width="110" height="8" rx="4" fill="#3A4A46"/>
  <rect x="462" y="558" width="76" height="24" rx="12" fill="#00D4A3"/><text x="500" y="574" text-anchor="middle" font-size="10" font-weight="700" fill="#04342C">Get quote</text>
  <circle class="ring" cx="522" cy="570" r="10" fill="none" stroke="#5FF0C8" stroke-width="2"/>
  <g transform="translate(520 566)"><g class="click"><path d="M0 0 L0 18 L5 14 L8 21 L11 20 L8 13 L14 13 Z" fill="#F2F5F4" stroke="#0A0A0A" stroke-width="1.4" stroke-linejoin="round"/></g></g>
  <text x="606" y="575" text-anchor="end" font-size="10" font-weight="600" fill="#C9D6D2">CTR 6.8%</text>
</g>

<!-- badge -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="24" y="530" width="200" height="40" rx="20" fill="#111614" stroke="#22302C"/></g>
  <circle cx="46" cy="550" r="6" fill="#00D4A3"/>
  <text x="60" y="554.5" font-size="12" font-weight="600" fill="#F2F5F4">SEO · PPC · Social</text>
</g>
</svg>
