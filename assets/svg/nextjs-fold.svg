<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FF0C8"/><stop offset="1" stop-color="#00B892"/></linearGradient>
  <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6B4FF"/><stop offset="1" stop-color="#8A68FF"/></linearGradient>
  <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC94D"/><stop offset="1" stop-color="#FF7A57"/></linearGradient>
  <linearGradient id="gHero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03866F"/><stop offset=".55" stop-color="#004337"/><stop offset="1" stop-color="#00211B"/></linearGradient>
  <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131B18"/><stop offset="1" stop-color="#0C1110"/></linearGradient>
  <linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1B2421"/><stop offset=".5" stop-color="#2A3532"/><stop offset="1" stop-color="#1B2421"/></linearGradient>
  <radialGradient id="gGlow" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#00D4A3" stop-opacity=".26"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <clipPath id="win"><rect x="150" y="110" width="350" height="360" rx="24"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .tag,.ring,.ok{transform-box:fill-box}
  .L{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
  .sk{animation-name:sk}
  @keyframes sk{0%,6%{opacity:1}12%,92%{opacity:0}100%{opacity:1}}
  .ct{animation-name:ct}
  @keyframes ct{0%,6%{opacity:0;transform:translateY(6px)}12%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
  .d1{animation-delay:.1s}.d2{animation-delay:.6s}.d3{animation-delay:1.2s}.d4{animation-delay:1.8s}
  .tag{transform-origin:50% 50%;animation-name:tag;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
  @keyframes tag{0%,10%{transform:scale(0)}15%,92%{transform:scale(1)}98%,100%{transform:scale(0)}}
  .shimmer{animation:shimmer 1.2s linear infinite}
  @keyframes shimmer{from{transform:translateX(-120px)}to{transform:translateX(320px)}}
  .ring{transform-origin:50% 50%;transform:rotate(-90deg);stroke-dasharray:0 100;animation:ring 8s cubic-bezier(.2,.8,.2,1) infinite}
  @keyframes ring{0%,18%{stroke-dasharray:0 100}34%,92%{stroke-dasharray:var(--v) 100}100%{stroke-dasharray:0 100}}
  .r2{animation-delay:.2s}.r3{animation-delay:.4s}.r4{animation-delay:.6s}
  .num{animation:num 8s steps(1,end) infinite}
  @keyframes num{0%{opacity:0}32%{opacity:1}96%{opacity:0}}
  .edge{transform-box:fill-box;transform-origin:50% 50%;animation:edge 2s ease-out infinite}
  @keyframes edge{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
  .e2{animation-delay:-.5s}.e3{animation-delay:-1s}.e4{animation-delay:-1.5s}
  .hop{stroke-dasharray:3 5;animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-16}}
  .feed{offset-rotate:0deg;animation:feed 2.6s ease-in-out infinite}
  @keyframes feed{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
  .f2{animation-delay:-1.3s}
  .route{animation:route 8s steps(1,end) infinite}
  @keyframes route{0%{transform:translateY(0)}25%{transform:translateY(24px)}50%{transform:translateY(48px)}75%{transform:translateY(72px)}}
  .bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.sk{opacity:0}.ring{stroke-dasharray:var(--v) 100}.num{opacity:1}}
</style>

<circle cx="320" cy="300" r="300" fill="url(#gGlow)"/>

<!-- browser: page streams in, each part tagged with how it renders -->
<g filter="url(#soft)"><rect x="150" y="110" width="350" height="360" rx="24" fill="url(#gBoard)" stroke="#22302C"/></g>
<g clip-path="url(#win)">
  <rect x="150" y="110" width="350" height="36" fill="#0A0F0E"/>
  <circle cx="174" cy="128" r="5" fill="#FF8A6B"/><circle cx="192" cy="128" r="5" fill="#FFC94D"/><circle cx="210" cy="128" r="5" fill="#00D4A3"/>
  <rect x="240" y="119" width="170" height="18" rx="9" fill="#151D1A"/><circle cx="252" cy="128" r="3" fill="#00D4A3"/>
  <text x="260" y="131.5" font-size="9.5" fill="#8FA39E">yourbrand.com/blog</text>

  <!-- block 1: header (static) -->
  <rect x="166" y="156" width="318" height="28" rx="9" fill="url(#shim)" class="L sk"/>
  <g class="L ct d1"><rect x="166" y="156" width="318" height="28" rx="9" fill="#151D1A"/><circle cx="182" cy="170" r="6" fill="url(#gMint)"/><g fill="#3A4A46"><rect x="380" y="166" width="24" height="7" rx="3.5"/><rect x="410" y="166" width="24" height="7" rx="3.5"/><rect x="440" y="166" width="30" height="7" rx="3.5"/></g></g>

  <!-- block 2: hero (static generation) -->
  <rect x="166" y="194" width="318" height="110" rx="12" fill="url(#shim)" class="L sk d2"/>
  <g class="L ct d2"><rect x="166" y="194" width="318" height="110" rx="12" fill="url(#gHero)"/>
    <rect x="182" y="214" width="56" height="7" rx="3.5" fill="#5FF0C8"/>
    <rect x="182" y="230" width="160" height="14" rx="7" fill="#F2F5F4"/><rect x="182" y="250" width="120" height="14" rx="7" fill="#F2F5F4"/>
    <rect x="182" y="276" width="70" height="16" rx="8" fill="#5FF0C8"/>
    <circle cx="430" cy="250" r="30" fill="url(#gViolet)"/><rect x="398" y="262" width="34" height="34" rx="9" fill="url(#gCoral)"/></g>

  <!-- block 3: posts (server rendered) -->
  <rect x="166" y="314" width="154" height="94" rx="12" fill="url(#shim)" class="L sk d3"/>
  <rect x="330" y="314" width="154" height="94" rx="12" fill="url(#shim)" class="L sk d3"/>
  <g class="L ct d3">
    <rect x="166" y="314" width="154" height="94" rx="12" fill="#151D1A"/><rect x="176" y="324" width="134" height="44" rx="8" fill="url(#gMint)" fill-opacity=".85"/><rect x="176" y="376" width="110" height="7" rx="3.5" fill="#C9D6D2"/><rect x="176" y="390" width="76" height="6" rx="3" fill="#3A4A46"/>
    <rect x="330" y="314" width="154" height="94" rx="12" fill="#151D1A"/><rect x="340" y="324" width="134" height="44" rx="8" fill="url(#gCoral)" fill-opacity=".85"/><rect x="340" y="376" width="110" height="7" rx="3.5" fill="#C9D6D2"/><rect x="340" y="390" width="76" height="6" rx="3" fill="#3A4A46"/>
  </g>

  <!-- block 4: interactive (client) -->
  <rect x="166" y="418" width="318" height="40" rx="12" fill="url(#shim)" class="L sk d4"/>
  <g class="L ct d4"><rect x="166" y="418" width="318" height="40" rx="12" fill="#151D1A"/>
    <rect x="178" y="428" width="200" height="20" rx="10" fill="#0A0F0E"/><text x="190" y="442" font-size="9" fill="#5D6E69">Subscribe for updates…</text>
    <rect x="384" y="428" width="88" height="20" rx="10" fill="#B39BFF"/><text x="428" y="442" text-anchor="middle" font-size="9" font-weight="700" fill="#0A0A0A">Subscribe</text></g>

</g>
<!-- render-mode tags -->
<g font-size="8.5" font-weight="700" letter-spacing="1">
  <g class="L tag d2"><rect x="436" y="186" width="56" height="18" rx="9" fill="#5FF0C8"/><text x="464" y="198.5" text-anchor="middle" fill="#04342C">STATIC</text></g>
  <g class="L tag d3"><rect x="442" y="306" width="50" height="18" rx="9" fill="#FFC94D"/><text x="467" y="318.5" text-anchor="middle" fill="#0A0A0A">SSR</text></g>
  <g class="L tag d4"><rect x="430" y="410" width="62" height="18" rx="9" fill="#B39BFF"/><text x="461" y="422.5" text-anchor="middle" fill="#0A0A0A">CLIENT</text></g>
</g>

<!-- card: routes -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="16" y="150" width="150" height="160" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="32" y="176" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">ROUTES</text>
  <g class="route"><rect x="28" y="184" width="126" height="22" rx="7" fill="#0F3D33"/></g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#C9D6D2">
    <text x="36" y="199"><tspan fill="#8FA39E">app/</tspan>page.tsx</text>
    <text x="46" y="223"><tspan fill="#8FA39E">about/</tspan>page</text>
    <text x="46" y="247"><tspan fill="#8FA39E">blog/</tspan>[slug]</text>
    <text x="46" y="271"><tspan fill="#8FA39E">api/</tspan>route.ts</text>
  </g>
  <text x="32" y="298" font-size="8.5" fill="#5D6E69">File-based routing</text>
</g>

<!-- card: lighthouse-style scores -->
<g class="bob">
  <g filter="url(#soft)"><rect x="410" y="20" width="214" height="108" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="426" y="46" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">PAGE SCORES</text>
  <g font-size="11" font-weight="700" fill="#F2F5F4" text-anchor="middle">
    <g transform="translate(446 84)"><circle r="16" fill="none" stroke="#22302C" stroke-width="4"/><circle class="ring" style="--v:100" r="16" pathLength="100" fill="none" stroke="#00D4A3" stroke-width="4" stroke-linecap="round"/><text class="num" y="4">100</text><text y="32" font-size="8" font-weight="500" fill="#8FA39E">Speed</text></g>
    <g transform="translate(494 84)"><circle r="16" fill="none" stroke="#22302C" stroke-width="4"/><circle class="ring r2" style="--v:98" r="16" pathLength="100" fill="none" stroke="#00D4A3" stroke-width="4" stroke-linecap="round"/><text class="num" y="4">98</text><text y="32" font-size="8" font-weight="500" fill="#8FA39E">Access</text></g>
    <g transform="translate(542 84)"><circle r="16" fill="none" stroke="#22302C" stroke-width="4"/><circle class="ring r3" style="--v:100" r="16" pathLength="100" fill="none" stroke="#00D4A3" stroke-width="4" stroke-linecap="round"/><text class="num" y="4">100</text><text y="32" font-size="8" font-weight="500" fill="#8FA39E">Practice</text></g>
    <g transform="translate(590 84)"><circle r="16" fill="none" stroke="#22302C" stroke-width="4"/><circle class="ring r4" style="--v:100" r="16" pathLength="100" fill="none" stroke="#00D4A3" stroke-width="4" stroke-linecap="round"/><text class="num" y="4">100</text><text y="32" font-size="8" font-weight="500" fill="#8FA39E">SEO</text></g>
  </g>
</g>

<!-- card: edge network -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="410" y="492" width="214" height="118" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="426" y="518" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">EDGE DELIVERY</text>
  <text x="608" y="518" text-anchor="end" font-size="10" font-weight="700" fill="#F2F5F4">42ms</text>
  <g fill="#2A3A36"><circle cx="440" cy="550" r="1.6"/><circle cx="452" cy="546" r="1.6"/><circle cx="464" cy="552" r="1.6"/><circle cx="476" cy="544" r="1.6"/><circle cx="500" cy="560" r="1.6"/><circle cx="520" cy="548" r="1.6"/><circle cx="534" cy="556" r="1.6"/><circle cx="552" cy="546" r="1.6"/><circle cx="570" cy="560" r="1.6"/><circle cx="590" cy="552" r="1.6"/><circle cx="460" cy="578" r="1.6"/><circle cx="480" cy="584" r="1.6"/><circle cx="540" cy="580" r="1.6"/><circle cx="580" cy="584" r="1.6"/><circle cx="600" cy="574" r="1.6"/></g>
  <g fill="none" stroke="#5FF0C8" stroke-opacity=".5" stroke-width="1.4">
    <path class="hop" d="M516 566 Q 486 540 452 552"/><path class="hop" d="M516 566 Q 548 534 586 548"/><path class="hop" d="M516 566 Q 494 590 466 586"/><path class="hop" d="M516 566 Q 556 594 594 582"/>
  </g>
  <circle class="edge" cx="452" cy="552" r="5" fill="none" stroke="#5FF0C8" stroke-width="2"/><circle cx="452" cy="552" r="3.5" fill="#5FF0C8"/>
  <circle class="edge e2" cx="586" cy="548" r="5" fill="none" stroke="#B39BFF" stroke-width="2"/><circle cx="586" cy="548" r="3.5" fill="#B39BFF"/>
  <circle class="edge e3" cx="466" cy="586" r="5" fill="none" stroke="#FFC94D" stroke-width="2"/><circle cx="466" cy="586" r="3.5" fill="#FFC94D"/>
  <circle class="edge e4" cx="594" cy="582" r="5" fill="none" stroke="#FF8A6B" stroke-width="2"/><circle cx="594" cy="582" r="3.5" fill="#FF8A6B"/>
  <circle cx="516" cy="566" r="7" fill="#F2F5F4"/><circle cx="516" cy="566" r="3" fill="#0A0A0A"/>
</g>

<!-- card: headless CMS -->
<g class="bob">
  <g filter="url(#soft)"><rect x="16" y="492" width="214" height="118" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="32" y="518" font-size="10.5" font-weight="600" letter-spacing="2" fill="#FFC94D">HEADLESS CMS</text>
  <g font-size="8.5" fill="#C9D6D2" text-anchor="middle">
    <rect x="32" y="532" width="54" height="50" rx="10" fill="#151D1A"/><rect x="40" y="542" width="38" height="6" rx="3" fill="#FFC94D"/><rect x="40" y="552" width="30" height="5" rx="2.5" fill="#3A4A46"/><rect x="40" y="561" width="34" height="5" rx="2.5" fill="#3A4A46"/><text x="59" y="596">Content</text>
    <rect x="104" y="544" width="40" height="26" rx="13" fill="#0F3D33"/><text x="124" y="560" font-weight="700" fill="#5FF0C8" font-size="9">API</text><text x="124" y="596">Fetch</text>
    <rect x="162" y="532" width="54" height="50" rx="10" fill="#151D1A"/><rect x="170" y="540" width="38" height="18" rx="5" fill="url(#gMint)"/><rect x="170" y="564" width="30" height="5" rx="2.5" fill="#3A4A46"/><text x="189" y="596">Page</text>
  </g>
  <path d="M86 557 H104 M144 557 H162" stroke="#5FF0C8" stroke-opacity=".5" stroke-width="1.6" class="hop"/>
  <circle class="feed" style="offset-path:path('M86 557 H 162')" r="4" fill="#FFC94D"/>
  <circle class="feed f2" style="offset-path:path('M86 557 H 162')" r="4" fill="#FFC94D"/>
</g>

<!-- badge -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="16" y="40" width="210" height="40" rx="20" fill="#111614" stroke="#22302C"/></g>
  <rect x="28" y="50" width="60" height="20" rx="10" fill="#F2F5F4"/><text x="58" y="64" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0A0A0A">Next.js</text>
  <text x="98" y="64.5" font-size="12" font-weight="600" fill="#F2F5F4">Fast by default</text>
</g>
</svg>
