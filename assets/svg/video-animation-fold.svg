    <g class="sb"><rect x="-2" y="-2" width="54" height="44" rx="8" fill="none" stroke="#5FF0C8" stroke-width="2"/></g>
    <g font-size="8.5" fill="#5D6E69"><text x="0" y="52">01</text><text x="56" y="52">02</text><text x="112" y="52">03</text></g>
  </g>
</g></g>

<!-- card: motion easing -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="440" y="18" width="180" height="114" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="456" y="44" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">MOTION</text>
  <text x="604" y="44" text-anchor="end" font-size="9" fill="#5D6E69">ease-in-out</text>
  <g transform="translate(470 58)">
    <path d="M0 56 H110 M0 56 V0" stroke="#22302C" stroke-width="1.5"/>
    <path d="M0 56 C 40 56 30 0 110 0" fill="none" stroke="url(#gMint)" stroke-width="2.5"/>
    <path d="M0 56 L40 56 M110 0 L30 0" stroke="#5D6E69" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="40" cy="56" r="3.5" fill="#B39BFF"/><circle cx="30" cy="0" r="3.5" fill="#B39BFF"/>
    <circle class="ease" r="5.5" fill="#F2F5F4" stroke="#00D4A3" stroke-width="2"/>
  </g>
</g>

<!-- card: 2D / 3D -->
<g class="bob">
  <g filter="url(#soft)"><rect x="530" y="210" width="96" height="120" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="578" y="236" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">2D · 3D</text>
  <g class="cube">
    <path d="M578 252 L604 266 L578 280 L552 266 Z" fill="#5FF0C8"/>
    <path d="M552 266 L578 280 L578 310 L552 296 Z" fill="#00A884"/>
    <path d="M604 266 L578 280 L578 310 L604 296 Z" fill="#04342C" stroke="#00A884" stroke-width="1"/>
  </g>
</g>

<!-- card: export -->
<g class="bob2">
  <g filter="url(#soft)"><rect x="420" y="520" width="200" height="88" rx="18" fill="#111614" stroke="#22302C"/></g>
  <text x="436" y="546" font-size="10.5" font-weight="600" letter-spacing="2" fill="#5FF0C8">EXPORT</text>
  <text class="pct1" x="604" y="546" text-anchor="end" font-size="10" font-weight="600" fill="#C9D6D2">Rendering…</text>
  <text class="pct2" x="604" y="546" text-anchor="end" font-size="10" font-weight="700" fill="#5FF0C8">Done ✓</text>
  <rect x="436" y="560" width="168" height="8" rx="4" fill="#22302C"/>
  <rect class="exp" x="436" y="560" width="168" height="8" rx="4" fill="url(#gMint)"/>
  <text x="436" y="590" font-size="9.5" fill="#8FA39E">MP4 · 4K · Web &amp; Social</text>
</g>

<!-- badge -->
<g class="bob">
  <g filter="url(#soft)"><rect x="24" y="540" width="200" height="40" rx="20" fill="#111614" stroke="#22302C"/></g>
  <circle cx="46" cy="560" r="6" fill="#00D4A3"/>
  <text x="60" y="564.5" font-size="12" font-weight="600" fill="#F2F5F4">Script · Story · Motion</text>
</g>
</svg>
