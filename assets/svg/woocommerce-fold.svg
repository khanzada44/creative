<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
<defs>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FF0C8"/><stop offset="1" stop-color="#00B892"/></linearGradient>
  <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6B4FF"/><stop offset="1" stop-color="#8A68FF"/></linearGradient>
  <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC94D"/><stop offset="1" stop-color="#FF7A57"/></linearGradient>
  <linearGradient id="gHero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03866F"/><stop offset=".55" stop-color="#004337"/><stop offset="1" stop-color="#00211B"/></linearGradient>
  <linearGradient id="gGauge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF7A57"/><stop offset=".5" stop-color="#FFC94D"/><stop offset="1" stop-color="#00D4A3"/></linearGradient>
  <radialGradient id="gGlow" cx=".45" cy=".45" r=".5"><stop offset="0" stop-color="#9B7BFF" stop-opacity=".16"/><stop offset=".5" stop-color="#00D4A3" stop-opacity=".14"/><stop offset="1" stop-color="#00D4A3" stop-opacity="0"/></radialGradient>
  <clipPath id="win"><rect x="40" y="70" width="380" height="330" rx="22"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<style>
  .pc,.wbar{transform-box:fill-box}
  .A{animation-duration:8s;animation-iteration-count:infinite;animation-fill-mode:backwards}
  .S{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
  .blog{animation-name:blog;animation-timing-function:ease-in-out}
  @keyframes blog{0%,23%{opacity:1;transform:none}28%,92%{opacity:0;transform:translateY(10px)}98%,100%{opacity:1;transform:none}}
  .store{animation-name:store;animation-timing-function:ease-in-out}
  @keyframes store{0%,29%{opacity:0}34%,92%{opacity:1}98%,100%{opacity:0}}
  .pc{transform-origin:50% 100%;animation-name:pc;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
  @keyframes pc{0%,30%{opacity:0;transform:translateY(16px) scale(.92)}40%,92%{opacity:1;transform:none}98%,100%{opacity:0;transform:translateY(16px) scale(.92)}}
  .pc2{animation-delay:.15s}.pc3{animation-delay:.3s}
  .u1{animation-name:u1}.u2{animation-name:u2}
  @keyframes u1{0%{opacity:1}32%{opacity:0}96%{opacity:1}}
  @keyframes u2{0%{opacity:0}32%{opacity:1}96%{opacity:0}}
  .cart{animation-name:u2}
  .cn1{animation-name:cn1}.cn2{animation-name:cn2}
  @keyframes cn1{0%{opacity:1}62%{opacity:0}96%{opacity:1}}
  @keyframes cn2{0%{opacity:0}62%{opacity:1}96%{opacity:0}}
  .btn{animation-name:btn}
  @keyframes btn{0%,56%{fill:#04342C}58%,90%{fill:#00B892}96%,100%{fill:#04342C}}
  .tap{animation-name:tap;animation-timing-function:ease-out}
  @keyframes tap{0%,55%{opacity:0;r:2}57%{opacity:.6;r:4}64%,100%{opacity:0;r:22}}
  .wand{animation-name:wand;animation-timing-function:ease-in-out}
  @keyframes wand{0%,18%{opacity:0;transform:translate(0,0)}22%{opacity:1}34%{opacity:1;transform:translate(300px,0)}38%,100%{opacity:0;transform:translate(300px,0)}}
  /* setup */
  .ck{animation-name:ck}
  @keyframes ck{0%,6%{opacity:0}10%,92%{opacity:1}98%,100%{opacity:0}}
  .ck2{animation-delay:.6s}.ck3{animation-delay:1.2s}.ck4{animation-delay:1.8s}
  .wbar{transform-origin:0 50%;animation-name:wbar;animation-timing-function:ease-in-out}
  @keyframes wbar{0%,6%{transform:scaleX(0)}34%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  /* discovery */
  .typ{clip-path:inset(0 100% 0 0);animation:typ 8s steps(5,end) infinite}
  @keyframes typ{0%,8%{clip-path:inset(0 100% 0 0)}20%,92%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
  .ch1{animation-name:ch1}.ch2{animation-name:ch2}
  @keyframes ch1{0%,26%{fill:#151D1A}30%,92%{fill:#00D4A3}96%,100%{fill:#151D1A}}
  @keyframes ch2{0%,40%{fill:#151D1A}44%,92%{fill:#00D4A3}96%,100%{fill:#151D1A}}
  .ct1{animation-name:ct1}.ct2{animation-name:ct2}
  @keyframes ct1{0%,26%{fill:#C9D6D2}30%,92%{fill:#04342C}96%,100%{fill:#C9D6D2}}
  @keyframes ct2{0%,40%{fill:#C9D6D2}44%,92%{fill:#04342C}96%,100%{fill:#C9D6D2}}
  .r1{animation-name:r1}.r2{animation-name:r2}
  @keyframes r1{0%{opacity:1}44%{opacity:0}96%{opacity:1}}
  @keyframes r2{0%{opacity:0}44%{opacity:1}96%{opacity:0}}
  /* fix */
  .e1{animation-name:e1}.e2{animation-name:e2}
  @keyframes e1{0%{opacity:1}48%{opacity:0}96%{opacity:1}}
  @keyframes e2{0%{opacity:0}48%{opacity:1}96%{opacity:0}}
  .tk{animation-name:tk;animation-timing-function:ease-in-out}
  @keyframes tk{0%,56%{transform:translateX(0)}60%,92%{transform:translateX(10px)}96%,100%{transform:translateX(0)}}
  .tt{animation-name:tt}
  @keyframes tt{0%,56%{fill:#2A3632}60%,92%{fill:#00D4A3}96%,100%{fill:#2A3632}}
  .scan{animation-name:scan;animation-timing-function:ease-in-out}
  @keyframes scan{0%,10%{transform:translateY(0);opacity:0}14%{opacity:1}44%{transform:translateY(40px);opacity:1}48%,100%{transform:translateY(40px);opacity:0}}
  /* speed */
  .ndl{animation-name:ndl;animation-timing-function:cubic-bezier(.3,1.3,.5,1)}
  @keyframes ndl{0%,30%{transform:rotate(-62deg)}50%,92%{transform:rotate(62deg)}100%{transform:rotate(-62deg)}}
  .sp1{animation-name:e1}.sp2{animation-name:e2}
  .live{animation:live 1.4s ease-in-out infinite}
  @keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
  .bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out -2s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.blog,.u1,.cn1,.r1,.e1,.sp1,.wand,.tap{opacity:0}.typ{clip-path:none}.ndl{transform:rotate(62deg)}}
</style>

<circle cx="300" cy="300" r="310" fill="url(#gGlow)"/>

<!-- ===== browser: site becomes store ===== -->
<g filter="url(#soft)"><rect x="40" y="70" width="380" height="330" rx="22" fill="#F6F1E7"/></g>
