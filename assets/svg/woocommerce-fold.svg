    <g fill="#B8AE99"><rect x="64" y="322" width="80" height="7" rx="3.5"/><rect x="64" y="335" width="60" height="6" rx="3"/><rect x="64" y="347" width="70" height="6" rx="3"/>
      <rect x="184" y="322" width="80" height="7" rx="3.5"/><rect x="184" y="335" width="60" height="6" rx="3"/><rect x="184" y="347" width="70" height="6" rx="3"/>
      <rect x="304" y="322" width="80" height="7" rx="3.5"/><rect x="304" y="335" width="60" height="6" rx="3"/><rect x="304" y="347" width="70" height="6" rx="3"/></g>
  </g>

  <!-- STORE version -->
